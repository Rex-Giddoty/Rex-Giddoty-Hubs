# Builds the Android app in the cloud.
#
# There is no Android Studio and no JDK on the shop's machine, and installing
# them is about ten gigabytes — so the build happens here instead. Push a tag
# like v2.0, or press "Run workflow" in the Actions tab, and a signed APK and
# AAB come back as downloadable artifacts.
#
# Four repository secrets are required. Settings ▸ Secrets and variables ▸
# Actions:
#   GOOGLE_SERVICES_JSON       — the whole google-services.json from Firebase
#   ANDROID_KEYSTORE_BASE64    — the signing keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  — its password
#   ANDROID_KEY_ALIAS          — the key alias inside it
#   ANDROID_KEY_PASSWORD       — that key's password
#
# Without the keystore secrets the build still runs and produces an unsigned
# APK, which is useful for checking the build itself but cannot be installed
# over the existing app.

name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run on anything below 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install Capacitor
        working-directory: native
        run: npm ci

      # Firebase will not initialise without this file, and without Firebase
      # there is no push. It is not in the repository: it names the project and
      # ships an API key, so it lives in a secret.
      - name: Write google-services.json
        working-directory: native/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set — push notifications would be dead in this build."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            || { echo "::error::google-services.json is not valid JSON."; exit 1; }

      - name: Sync web assets and plugins
        working-directory: native
        run: npx cap sync android

      # Written outside the workspace so it cannot be picked up by anything that
      # archives the checkout, and deleted at the end regardless of outcome.
      - name: Restore signing key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key — this build will be unsigned and cannot be installed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/signing.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Shred the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: rex-giddoty-hubs-apk
          path: native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rex-giddoty-hubs-aab
          path: native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
