<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shop — Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="nav" data-nav></header>

<main class="wrap" style="padding-top:44px;">
  <div class="section__head">
    <div>
      <div class="eyebrow" style="margin-bottom:10px;" id="crumb">Shop</div>
      <h1 class="display" id="title" style="font-size:clamp(30px,4.4vw,48px);">All pieces</h1>
      <p class="note" id="cat-desc" style="margin-top:8px;max-width:520px;"></p>
    </div>
    <select id="sort" style="padding:11px 13px;border:1px solid var(--line);background:#fff;">
      <option value="new">Newest</option>
      <option value="low">Price — low to high</option>
      <option value="high">Price — high to low</option>
      <option value="name">Name</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div id="state"></div>
</main>

<footer class="foot" data-foot></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC;
const params = new URLSearchParams(location.search);
const catSlug = params.get('category');
const isNew   = params.get('new') === '1';
let _items = [];

(async () => {
  await window.RG_CHROME();

  let categoryId = null;
  if (isNew) {
    document.getElementById('title').textContent = 'New Arrivals';
    document.getElementById('crumb').textContent = 'Just in';
    document.getElementById('cat-desc').textContent = 'The most recent additions to the collection.';
    document.title = 'New Arrivals — Rex-Giddoty Hubs';
    document.getElementById('sort').value = 'new';
  } else if (catSlug) {
    const { data: cat } = await db.from('categories')
      .select('id,name,description').eq('slug', catSlug).maybeSingle();
    if (cat) {
      categoryId = cat.id;
      document.getElementById('title').textContent = cat.name;
      document.getElementById('crumb').textContent = 'Collection';
      document.getElementById('cat-desc').textContent = cat.description || '';
      document.title = cat.name + ' — Rex-Giddoty Hubs';
    }
  }

  let q = db.from('products')
    .select('id,slug,name,price_minor,currency,created_at,product_images(path,position),product_variants(stock),product_categories!inner(category_id)')
    .eq('status', 'published');
  if (categoryId) q = q.eq('product_categories.category_id', categoryId);

  /* Without a category filter the inner join would drop uncategorised pieces,
     so fall back to a plain select when showing everything. */
  if (!categoryId) {
    q = db.from('products')
      .select('id,slug,name,price_minor,currency,created_at,product_images(path,position),product_variants(stock)')
      .eq('status', 'published');
    if (isNew) q = q.order('created_at', { ascending: false }).limit(24);
  }

  const { data, error } = await q;
  if (error) {
    document.getElementById('state').innerHTML =
      `<div class="empty-state"><p>${esc(error.message)}</p></div>`;
    return;
  }
  _items = data || [];
  render();
})();

function render() {
  const sort = document.getElementById('sort').value;
  const list = _items.slice().sort((a, b) => {
    if (sort === 'low')  return a.price_minor - b.price_minor;
    if (sort === 'high') return b.price_minor - a.price_minor;
    if (sort === 'name') return a.name.localeCompare(b.name);
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const grid  = document.getElementById('grid');
  const state = document.getElementById('state');
  if (!list.length) {
    grid.innerHTML = '';
    state.innerHTML = `<div class="empty-state">
      <h2 class="display">Nothing here yet</h2>
      <p>${catSlug ? 'This collection has no published pieces.' : 'No pieces have been published yet.'}</p>
      <a class="btn btn--ghost" href="/">Back to home</a>
    </div>`;
    return;
  }
  state.innerHTML = '';
  grid.innerHTML = list.map(window.RG_CARD).join('');
}
document.getElementById('sort').addEventListener('change', render);
</script>
</body>
</html>
