<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shop — Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="shell">
  <aside class="box rail-box" data-rail></aside>

  <main>
    <div class="box" style="padding:11px 13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div style="flex:1;min-width:0;">
        <h1 id="title" style="font-size:17px;font-weight:700;">All products</h1>
        <div class="note" id="sub"></div>
      </div>
      <select id="sort" style="padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:#fff;">
        <option value="new">Newest first</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="off">Biggest discount</option>
        <option value="name">Name A–Z</option>
      </select>
      <div class="chips" id="subcats" style="display:none;"></div>
      <div class="swatches" id="colfilter" style="display:none;flex-basis:100%;"></div>
    </div>

    <div class="sect" style="margin-top:8px;">
      <div class="pgrid" id="grid"></div>
    </div>
    <div id="state"></div>
  </main>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC;
const P = new URLSearchParams(location.search);
const catSlug = P.get('category'), isNew = P.get('new') === '1',
      isDeals = P.get('deals') === '1', q = (P.get('q') || '').trim();
const SWATCH = {
  black:'#1b1b1b', white:'#ffffff', 'off-white':'#f2ece1', grey:'#8b8b90', gray:'#8b8b90',
  brown:'#6b4423', tan:'#c19a6b', sand:'#dfcfb0', red:'#c62828', wine:'#6d1b2e',
  pink:'#e59bb7', orange:'#e07b25', yellow:'#e3b829', green:'#2f7d46', blue:'#1f4e9c',
  navy:'#1b2a4a', purple:'#9030d0', gold:'#c9a227', silver:'#c0c4c9',
  multicolour:'linear-gradient(135deg,#c62828,#e3b829,#2f7d46,#1f4e9c)',
};
const swatchFor = c => SWATCH[String(c || '').trim().toLowerCase()]
  || 'linear-gradient(135deg,#c9c9c9,#9a9a9a)';

const SEL = 'id,slug,name,price_minor,compare_at_minor,currency,badge,brand,rating_avg,rating_count,sold_count,created_at,product_images(path,position,color),product_variants(id,stock,color,price_minor)';
let _items = [];

(async () => {
  let categoryId = null, activeSlug = null;

  if (q) {
    setHead('Results for “' + q + '”', '');
  } else if (isNew) {
    setHead('New Arrivals', 'The most recent additions.');
    activeSlug = '__new';
    document.getElementById('sort').value = 'new';
  } else if (isDeals) {
    setHead('Deals', 'Everything currently reduced.');
    document.getElementById('sort').value = 'off';
  } else if (catSlug) {
    const { data: cat } = await db.from('categories')
      .select('id,name,description,parent_id').eq('slug', catSlug).maybeSingle();
    if (cat) { categoryId = cat.id; activeSlug = catSlug; setHead(cat.name, cat.description || ''); }
  }

  await window.RG_CHROME(activeSlug);

  /* A parent category shows everything filed under its children too — landing on
     "Collection" and seeing nothing because the products live in Tops and Jeans
     would just look broken. */
  let catIds = categoryId ? [categoryId] : null;
  if (categoryId) {
    const all = await window.RG_CATS();
    const kids = all.filter(c => c.parent_id === categoryId);
    if (kids.length) {
      catIds = [categoryId].concat(kids.map(c => c.id));
      const chips = document.getElementById('subcats');
      chips.style.display = '';
      chips.innerHTML = kids.map(c =>
        `<a href="/shop.html?category=${encodeURIComponent(c.slug)}">${esc(c.name)}</a>`).join('');
    } else {
      /* on a child page, offer its siblings for quick hopping */
      const me = all.find(c => c.id === categoryId);
      const sibs = me && me.parent_id ? all.filter(c => c.parent_id === me.parent_id) : [];
      if (sibs.length > 1) {
        const chips = document.getElementById('subcats');
        chips.style.display = '';
        chips.innerHTML = sibs.map(c =>
          `<a href="/shop.html?category=${encodeURIComponent(c.slug)}" class="${c.id === categoryId ? 'on' : ''}">${esc(c.name)}</a>`).join('');
      }
    }
  }

  let query;
  if (catIds) {
    query = db.from('products').select(SEL + ',product_categories!inner(category_id)')
      .eq('status','published').in('product_categories.category_id', catIds);
  } else {
    query = db.from('products').select(SEL).eq('status','published');
  }
  /* Search across name, brand and description — ilike keeps it simple and the
     catalogue is small enough that a full-text index would be premature. */
  if (q) {
    const safe = q.replace(/[%,()]/g, ' ');
    query = query.or(`name.ilike.%${safe}%,brand.ilike.%${safe}%,description.ilike.%${safe}%`);
  }

  const { data, error } = await query.limit(200);
  if (error) {
    document.getElementById('state').innerHTML = `<div class="box empty"><p>${esc(error.message)}</p></div>`;
    return;
  }
  _items = data || [];
  if (isDeals) _items = _items.filter(p => p.compare_at_minor && p.compare_at_minor > p.price_minor);
  paintColourFilter();
  render();
})();

/* Only the colours actually on this shelf, so the row never offers a colour
   that would return nothing. Hidden entirely when nothing here has one. */
let _colour = '';

function paintColourFilter() {
  const found = [];
  for (const p of _items) {
    for (const v of (p.product_variants || [])) {
      if (v.color && !found.includes(v.color)) found.push(v.color);
    }
  }
  found.sort((a, b) => a.localeCompare(b));
  const box = document.getElementById('colfilter');
  if (found.length < 2) { box.style.display = 'none'; return; }

  box.style.display = '';
  box.innerHTML = ['', ...found].map(c =>
    '<button class="swatchbtn ' + (c === _colour ? 'on' : '') + '" data-c="' + esc(c) + '">'
    + (c ? '<i style="background:' + swatchFor(c) + '"></i>' : '')
    + (c ? esc(c) : 'All colours') + '</button>').join('');

  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    _colour = b.dataset.c;
    paintColourFilter();
    render();
  });
}

function setHead(t, s) {
  document.getElementById('title').textContent = t;
  document.getElementById('sub').textContent = s || '';
  document.title = t + ' — Rex-Giddoty Hubs';
  if (window.RG_SEO) window.RG_SEO(document.title);
}

function render() {
  const sort = document.getElementById('sort').value;
  const off = p => (p.compare_at_minor && p.compare_at_minor > p.price_minor)
    ? 1 - p.price_minor / p.compare_at_minor : 0;
  const shown = _colour
    ? _items.filter(p => (p.product_variants || []).some(v => v.color === _colour))
    : _items;
  const list = shown.slice().sort((a,b) => {
    if (sort === 'low')  return a.price_minor - b.price_minor;
    if (sort === 'high') return b.price_minor - a.price_minor;
    if (sort === 'name') return a.name.localeCompare(b.name);
    if (sort === 'off')  return off(b) - off(a);
    return new Date(b.created_at) - new Date(a.created_at);
  });

  document.getElementById('sub').textContent =
    list.length + (list.length === 1 ? ' product' : ' products');

  const grid = document.getElementById('grid'), state = document.getElementById('state');
  if (!list.length) {
    grid.innerHTML = '';
    state.innerHTML = `<div class="box empty" style="margin-top:8px;">
      <h2 style="font-size:17px;">Nothing found</h2>
      <p>${q ? 'Try a different search term.' : 'No products here yet.'}</p>
      <a class="btn" href="/shop.html">Browse all products</a></div>`;
    return;
  }
  state.innerHTML = '';
  grid.innerHTML = list.map(window.RG_CARD).join('');
}
document.getElementById('sort').addEventListener('change', render);
</script>
</body>
</html>
