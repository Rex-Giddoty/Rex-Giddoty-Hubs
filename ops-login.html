<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Operations — Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#0c0c0d;color:#ececec;-webkit-font-smoothing:antialiased;}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:380px;background:#141416;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:34px 30px;}
.brand{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#8b8b90;text-align:center;margin-bottom:6px;}
h1{font-size:19px;font-weight:600;text-align:center;margin-bottom:26px;letter-spacing:-.2px;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8b8b90;margin-bottom:6px;}
input{width:100%;height:44px;background:#0c0c0d;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:0 13px;color:#ececec;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;}
input:focus{border-color:#8b8b90;}
.field{margin-bottom:16px;}
button{width:100%;height:44px;background:#ececec;color:#0c0c0d;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
button:hover{opacity:.88;}
button:disabled{opacity:.5;cursor:not-allowed;}
.err{background:rgba(220,60,60,.1);border:1px solid rgba(220,60,60,.3);color:#ff9b9b;font-size:12.5px;border-radius:8px;padding:10px 12px;margin-bottom:16px;display:none;line-height:1.5;}
.ok{background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.3);color:#8fe3bd;font-size:12.5px;border-radius:8px;padding:10px 12px;margin-bottom:16px;display:none;line-height:1.5;}

/* remember me, and the way to the reset step */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-bottom:0;}
.check input{width:15px;height:15px;accent-color:#ececec;cursor:pointer;flex-shrink:0;}
.check span{font-size:12.5px;color:#8b8b90;text-transform:none;letter-spacing:0;}
.check:hover span{color:#ececec;}
.linkbtn{background:none;border:0;color:#8b8b90;font-size:12.5px;cursor:pointer;
  font-family:inherit;text-decoration:underline;padding:0;width:auto;height:auto;}
.linkbtn:hover{color:#ececec;opacity:1;}
.lede{font-size:12.5px;color:#8b8b90;line-height:1.55;margin-bottom:18px;text-align:center;}

/* Whose shop this is, under the card rather than inside it. */
.by{margin-top:18px;text-align:center;font-size:11px;color:#5c5c63;line-height:1.6;}
</style>
<link rel="manifest" href="/ops.webmanifest"/>
<meta name="theme-color" content="#0c0c0d"/>
<link rel="icon" href="/assets/ops-icon-192.png"/>
<link rel="apple-touch-icon" href="/assets/ops-apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Ops"/>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">Rex-Giddoty Hubs</div>
    <h1>Operations</h1>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>

    <form id="form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required/>
      </div>
      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember"/>
          <span>Remember me</span>
        </label>
        <button type="button" class="linkbtn" id="to-reset">Forgot password?</button>
      </div>
      <button type="submit" id="btn">Sign in</button>
    </form>

    <!-- the reset step, in place rather than on the shop's own page: staff
         should not be bounced into the storefront to get back in here -->
    <form id="reset-form" style="display:none;">
      <p class="lede">Type the email you sign in with and we will send a link to
        set a new password.</p>
      <div class="field">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" autocomplete="username" required/>
      </div>
      <button type="submit" id="reset-btn">Send the link</button>
      <div class="row" style="margin:16px 0 0;justify-content:center;">
        <button type="button" class="linkbtn" id="to-signin">Back to sign in</button>
      </div>
    </form>
  </div>

  <div class="by">Developed by Jayrex inc<br/>on August 11, 2026</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script>

/* Registered for installability, not for caching: the worker passes every /ops
   request straight to the network. ops.html gets this through site.js; these
   standalone pages need their own, or a phone that lands on the sign-in page
   first is never offered the install. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

const db  = window.RG_DB;
const err = document.getElementById('err');
const ok  = document.getElementById('ok');
const btn = document.getElementById('btn');

function fail(msg) { ok.style.display = 'none'; err.textContent = msg; err.style.display = 'block'; }
function said(msg) { err.style.display = 'none'; ok.textContent = msg; ok.style.display = 'block'; }

/* ── remember me ──
 * The address, and only the address. A password sitting in localStorage is a
 * password anybody who picks up the laptop can read, and this account can empty
 * the shop — so that part stays with the browser's own password manager, which
 * is built for it and locks with the device.
 */
const REMEMBER = 'rg_ops_email';
const emailEl = document.getElementById('email');
const rememberEl = document.getElementById('remember');
try {
  const saved = localStorage.getItem(REMEMBER);
  if (saved) {
    emailEl.value = saved;
    rememberEl.checked = true;
    document.getElementById('password').focus();
  }
} catch (_) {}

/* ── the reset step ── */
const signInForm = document.getElementById('form');
const resetForm  = document.getElementById('reset-form');

document.getElementById('to-reset').onclick = () => {
  err.style.display = 'none'; ok.style.display = 'none';
  signInForm.style.display = 'none';
  resetForm.style.display = '';
  document.getElementById('reset-email').value = emailEl.value.trim();
  document.getElementById('reset-email').focus();
};
document.getElementById('to-signin').onclick = () => {
  err.style.display = 'none'; ok.style.display = 'none';
  resetForm.style.display = 'none';
  signInForm.style.display = '';
};

resetForm.addEventListener('submit', async e => {
  e.preventDefault();
  const rbtn = document.getElementById('reset-btn');
  const addr = document.getElementById('reset-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(addr)) return fail('That email address does not look right.');

  rbtn.disabled = true; rbtn.textContent = 'Sending…';
  /* ops=1 so the link comes back here afterwards rather than to the shop. */
  const { error } = await db.auth.resetPasswordForEmail(addr, {
    /* Staff never touch the storefront to get back into the console. */
    redirectTo: location.origin + '/ops-reset.html',
  });
  rbtn.disabled = false; rbtn.textContent = 'Send the link';

  if (error) return fail(error.message);
  /* Deliberately the same answer either way — otherwise this form becomes a
     way to find out which addresses have operations access. */
  resetForm.style.display = 'none';
  signInForm.style.display = '';
  said('If that address can sign in here, a reset link is on its way. Check the spam folder if it does not appear.');
});

/* Already signed in as staff? Go straight through. */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;
  const { data: admin } = await db.from('admin_users').select('id').eq('id', session.user.id).maybeSingle();
  if (admin) location.href = '/ops.html';
})();

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  /* Two real stages, and the bar moves when each one comes back. Nothing here
     is on a timer. */
  window.RG_BUSY.show('Signing in', true);
  window.RG_BUSY.pct(10, 'Checking your password');

  const addr = emailEl.value.trim();
  try {
    if (rememberEl.checked) localStorage.setItem(REMEMBER, addr);
    else localStorage.removeItem(REMEMBER);
  } catch (_) {}

  const { data, error } = await db.auth.signInWithPassword({
    email: addr,
    password: document.getElementById('password').value,
  });

  if (error) {
    window.RG_BUSY.hide();
    fail(error.message);
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }
  window.RG_BUSY.pct(55, 'Checking operations access');

  /* Signing in is not the same as being staff. Anyone with an account could
     reach this form, so membership decides access — and RLS enforces it again
     on every query regardless of what this page does. */
  const { data: admin } = await db.from('admin_users').select('id').eq('id', data.user.id).maybeSingle();
  if (!admin) {
    await db.auth.signOut();
    window.RG_BUSY.hide();
    fail('That account does not have operations access.');
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }

  sessionStorage.setItem('rg_ops_login_at', String(Date.now()));
  /* The veil stays up through the redirect: ops.html takes a moment to load,
     and a blank screen in between reads as a failure. */
  await window.RG_BUSY.done();
  window.RG_BUSY.show('Opening operations');
  location.href = '/ops.html';
});
</script>
</body>
</html>
