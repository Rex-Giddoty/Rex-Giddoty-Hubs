<!DOCTYPE html><html><body>
<script>
(async () => {
  const out = [];
  out.push('secure=' + window.isSecureContext);
  out.push('swAPI=' + ('serviceWorker' in navigator));
  try {
    const r = await navigator.serviceWorker.register('/sw.js');
    out.push('registered scope=' + r.scope);
    await navigator.serviceWorker.ready;
    out.push('ready=yes active=' + !!(r.active));
  } catch (e) { out.push('REGISTER FAILED: ' + e.message); }
  try {
    const m = await fetch('/manifest.webmanifest').then(r => r.json());
    const need = ['name','icons','start_url','display'];
    out.push('manifest ok fields=' + need.filter(k => m[k]).join(','));
    out.push('sizes=' + m.icons.map(i => i.sizes + (i.purpose === 'maskable' ? 'M' : '')).join('/'));
  } catch (e) { out.push('MANIFEST FAILED: ' + e.message); }
  let prompted = false;
  addEventListener('beforeinstallprompt', () => { prompted = true; });
  setTimeout(() => { document.title = out.join(' || ') + ' || beforeinstallprompt=' + prompted; }, 4000);
})();
</script></body></html>
