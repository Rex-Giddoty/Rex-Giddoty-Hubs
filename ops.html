<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Operations — Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/ops.css"/>
</head>
<body>

<div class="top">
  <div class="brand">Rex-Giddoty</div>
  <div class="tabs">
    <button class="tab active" data-page="products">Products</button>
    <button class="tab" data-page="categories">Categories</button>
    <button class="tab" data-page="orders">Orders</button>
    <button class="tab" data-page="customers">Customers</button>
    <button class="tab" data-page="settings">Settings</button>
  </div>
  <div class="who" id="who"></div>
  <button class="link" onclick="signOut()">Sign out</button>
</div>

<!-- PRODUCTS -->
<div class="page active" id="page-products">
  <div class="head">
    <h2>Products</h2><span class="count" id="products-count"></span>
    <div class="spacer"></div>
    <input class="inp" id="product-search" placeholder="Search…" style="max-width:200px;" oninput="renderProducts()"/>
    <button class="btn btn--primary" onclick="openProduct()">+ New product</button>
  </div>
  <div class="card"><div id="products-body"></div></div>
</div>

<!-- CATEGORIES -->
<div class="page" id="page-categories">
  <div class="head">
    <h2>Categories</h2><span class="count" id="categories-count"></span>
    <div class="spacer"></div>
    <a class="btn btn--primary" href="/ops-category.html">+ New category</a>
  </div>
  <div class="card"><div id="categories-body"></div></div>
</div>

<!-- ORDERS -->
<div class="page" id="page-orders">
  <div class="head">
    <h2>Orders</h2><span class="count" id="orders-count"></span>
    <div class="spacer"></div>
    <select class="inp" id="order-filter" style="max-width:170px;" onchange="renderOrders()">
      <option value="">All statuses</option>
      <option value="pending">Pending payment</option>
      <option value="paid">Paid</option>
      <option value="packed">Packed</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
      <option value="refunded">Refunded</option>
    </select>
  </div>
  <div class="card"><div id="orders-body"></div></div>
</div>

<!-- CUSTOMERS -->
<div class="page" id="page-customers">
  <div class="head">
    <h2>Customers</h2><span class="count" id="customers-count"></span>
    <div class="spacer"></div>
    <input class="inp" id="customer-search" placeholder="Search name, email or phone…"
      oninput="renderCustomers()"/>
    <select class="inp" id="customer-filter" onchange="renderCustomers()">
      <option value="">Everyone</option>
      <option value="active">Active</option>
      <option value="blocked">Blocked</option>
      <option value="buyers">Has ordered</option>
    </select>
  </div>
  <div class="stat" id="customers-stats"></div>
  <div class="card"><div id="customers-body"></div></div>
</div>

<!-- CUSTOMER MODAL -->
<div class="modal" id="customer-modal">
  <div class="sheet" style="max-width:560px;">
    <h3 id="customer-modal-title">Customer</h3>
    <div id="customer-detail"></div>
    <div class="row-actions">
      <button class="btn btn--danger" id="cu-delete" onclick="deleteCustomer()">Delete account</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal('customer-modal')">Close</button>
      <button class="btn btn--primary" id="cu-block" onclick="toggleBlock()">Block</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="head"><h2>Store settings</h2></div>
  <div class="card" style="padding:22px;">
    <div class="grid">
      <div><label class="f">Store name</label><input class="inp" id="s-store_name"/></div>
      <div><label class="f">Currency</label>
        <select class="inp" id="s-currency">
          <option value="NGN">NGN — Naira</option><option value="USD">USD — Dollar</option>
          <option value="EUR">EUR — Euro</option><option value="GBP">GBP — Pound</option>
        </select>
      </div>
      <div><label class="f">Flat shipping</label><input class="inp" id="s-shipping_flat_minor" inputmode="decimal" placeholder="5000.00"/></div>
      <div><label class="f">Free shipping over</label><input class="inp" id="s-free_shipping_over_minor" inputmode="decimal" placeholder="200000.00"/></div>
      <div class="full"><label class="f">Hero heading</label><input class="inp" id="s-hero_heading"/></div>
      <div class="full"><label class="f">Hero subheading</label><input class="inp" id="s-hero_subheading"/></div>
    </div>

    <h3 style="font-size:13px;font-weight:600;margin:24px 0 12px;padding-top:18px;border-top:1px solid var(--b);">Contact &amp; social</h3>
    <div class="grid">
      <div><label class="f">Contact email</label><input class="inp" id="s-support_email" placeholder="rexgiddotyhubs@gmail.com"/></div>
      <div><label class="f">Phone shown on the site</label><input class="inp" id="s-support_phone" placeholder="0801 234 5678"/></div>
      <div class="full"><label class="f">Facebook</label>
        <input class="inp" id="s-social_facebook" placeholder="https://facebook.com/yourpage"/></div>
      <div class="full"><label class="f">Instagram</label>
        <input class="inp" id="s-social_instagram" placeholder="https://instagram.com/yourhandle"/></div>
      <div class="full"><label class="f">X (Twitter)</label>
        <input class="inp" id="s-social_x" placeholder="https://x.com/yourhandle"/></div>
      <div class="full"><div class="muted" style="font-size:12px;">
        Paste the full address of each page. Leave one blank and its icon simply
        does not appear in the footer.</div></div>
    </div>
    <h3 style="font-size:13px;font-weight:600;margin:24px 0 12px;padding-top:18px;border-top:1px solid var(--b);">Payment — manual confirmation</h3>
    <div class="grid">
      <div><label class="f">Bank name</label><input class="inp" id="s-bank_name"/></div>
      <div><label class="f">Account name</label><input class="inp" id="s-bank_account_name"/></div>
      <div><label class="f">Account number</label><input class="inp" id="s-bank_account_number"/></div>
      <div class="full"><label class="f">Instructions shown at checkout</label><textarea class="inp" id="s-payment_instructions"></textarea></div>
    </div>
    <div class="row-actions"><button class="btn btn--primary" onclick="saveSettings()">Save settings</button></div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal" id="product-modal">
  <div class="sheet">
    <h3 id="product-modal-title">New product</h3>
    <div class="grid">
      <div><label class="f">Name</label><input class="inp" id="p-name" oninput="autoSlug()"/></div>
      <div><label class="f">URL slug</label><input class="inp" id="p-slug" placeholder="capucines-mm"/></div>
      <div class="full"><label class="f">Subtitle</label><input class="inp" id="p-subtitle" placeholder="Taurillon leather"/></div>
      <div><label class="f">Price</label><input class="inp" id="p-price" inputmode="decimal" placeholder="250000.00"/></div>
      <div><label class="f">Status</label>
        <select class="inp" id="p-status">
          <option value="draft">Draft — hidden</option>
          <option value="published">Published — live</option>
          <option value="archived">Archived</option>
        </select>
      </div>
      <div><label class="f">Category</label><select class="inp" id="p-category"><option value="">— none —</option></select></div>
      <div><label class="f">Featured</label><select class="inp" id="p-featured"><option value="false">No</option><option value="true">Yes</option></select></div>
      <div class="full"><label class="f">Description</label><textarea class="inp" id="p-description"></textarea></div>
      <div class="full"><label class="f">Details / materials</label><textarea class="inp" id="p-details"></textarea></div>
      <div class="full">
        <label class="f">Images — first is the main shot</label>
        <div class="imgs" id="p-images"></div>
        <input type="file" id="p-image-file" accept="image/*" multiple style="display:none;" onchange="uploadImages(this)"/>
      </div>
      <div class="full">
        <label class="f">Sizes &amp; stock</label>
        <div id="p-variants"></div>
        <button class="btn btn--sm" onclick="addVariantRow()" style="margin-top:4px;">+ Add size</button>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn--danger" id="p-delete" onclick="deleteProduct()">Delete</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal('product-modal')">Cancel</button>
      <button class="btn btn--primary" onclick="saveProduct()">Save product</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<!-- ORDER MODAL -->
<div class="modal" id="order-modal">
  <div class="sheet" style="max-width:640px;">
    <h3 id="order-modal-title">Order</h3>
    <div id="order-detail"></div>
    <div class="row-actions">
      <button class="btn" onclick="closeModal('order-modal')">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script>
const db = window.RG_DB;
const M  = window.RG_MONEY;
const IMG = window.RG_IMG;

let _me = null, _products = [], _categories = [], _orders = [], _settings = {};
let _editProduct = null, _editCategory = null, _pImages = [], _pVariants = [];

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

let _toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m =>
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('page-' + t.dataset.page).classList.add('active');
  localStorage.setItem('rg-ops-tab', t.dataset.page);
});

async function signOut(){ await db.auth.signOut(); location.href = '/ops-login.html'; }

/* ── boot ── */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = '/ops-login.html'; return; }
  const { data: admin } = await db.from('admin_users').select('id,email,role').eq('id', session.user.id).maybeSingle();
  if (!admin) { await db.auth.signOut(); location.href = '/ops-login.html'; return; }

  _me = admin;
  document.getElementById('who').textContent = session.user.email;

  const saved = localStorage.getItem('rg-ops-tab');
  if (saved) {
    const t = document.querySelector(`.tab[data-page="${saved}"]`);
    if (t) t.click();
  }

  await Promise.all([loadSettings(), loadCategories(), loadProducts(), loadOrders(), loadCustomers()]);
})();

/* ── settings ── */
async function loadSettings() {
  const { data } = await db.from('site_settings').select('key,value');
  _settings = Object.fromEntries((data || []).map(r => [r.key, r.value]));
  ['store_name','currency','hero_heading','hero_subheading',
   'support_email','support_phone','social_facebook','social_instagram','social_x',
   'bank_name','bank_account_name','bank_account_number','payment_instructions']
    .forEach(k => { const el = document.getElementById('s-' + k); if (el) el.value = _settings[k] || ''; });
  ['shipping_flat_minor','free_shipping_over_minor'].forEach(k => {
    const el = document.getElementById('s-' + k);
    if (el) el.value = _settings[k] ? M.toMajor(_settings[k]) : '';
  });
}

async function saveSettings() {
  const rows = [];
  ['store_name','currency','hero_heading','hero_subheading',
   'support_email','support_phone','social_facebook','social_instagram','social_x',
   'bank_name','bank_account_name','bank_account_number','payment_instructions']
    .forEach(k => rows.push({ key: k, value: document.getElementById('s-' + k).value.trim(), updated_at: new Date().toISOString() }));
  ['shipping_flat_minor','free_shipping_over_minor'].forEach(k =>
    rows.push({ key: k, value: String(M.toMinor(document.getElementById('s-' + k).value)), updated_at: new Date().toISOString() }));

  const { error } = await db.from('site_settings').upsert(rows, { onConflict: 'key' });
  if (error) return toast(error.message, true);
  await loadSettings();
  toast('Settings saved');
}

/* ── categories ── */
async function loadCategories() {
  const { data, error } = await db.from('categories').select('*').order('position').order('name');
  if (error) return toast(error.message, true);
  _categories = data || [];
  /* Order the picker as the shopper sees it: each parent followed by its own
     children, indented, rather than one flat alphabetical run. */
  const sel = document.getElementById('p-category');
  sel.innerHTML = '<option value="">— none —</option>' +
    catOrder().map(c => `<option value="${c.id}">${c.parent_id ? '&nbsp;&nbsp;— ' : ''}${esc(c.name)}</option>`).join('');
  renderCategories();
}

/* parents in position order, each trailed by its children */
function catOrder() {
  const tops = _categories.filter(c => !c.parent_id);
  const out = [];
  for (const t of tops) {
    out.push(t);
    for (const k of _categories.filter(c => c.parent_id === t.id)) out.push(k);
  }
  /* anything orphaned still has to appear somewhere */
  for (const c of _categories) if (!out.includes(c)) out.push(c);
  return out;
}

function renderCategories() {
  document.getElementById('categories-count').textContent = _categories.length + ' total';
  const box = document.getElementById('categories-body');
  if (!_categories.length) { box.innerHTML = '<div class="empty">No categories yet. Add one to group your products.</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>Name</th><th class="hide-sm">Slug</th><th>Products</th><th>Visible</th><th></th></tr></thead><tbody>` +
    catOrder().map(c => {
      const kids = _categories.filter(k => k.parent_id === c.id);
      const ids = [c.id].concat(kids.map(k => k.id));
      /* a parent counts its children's products, matching what the storefront shows */
      const n = _products.filter(p => (p.product_categories || [])
        .some(pc => ids.includes(pc.category_id))).length;
      return `<tr>
        <td>${c.parent_id ? '<span class="muted">└&nbsp;</span>' : ''}${esc(c.name)}${
          kids.length ? ` <span class="muted" style="font-size:12px;">(${kids.length} in drop-down)</span>` : ''}</td>
        <td class="hide-sm muted">/${esc(c.slug)}</td>
        <td class="muted">${n}</td>
        <td>${c.is_active ? '<span class="pill pill--live">Visible</span>' : '<span class="pill pill--draft">Hidden</span>'}</td>
        <td style="text-align:right;"><a class="btn btn--sm" href="/ops-category.html?id=${c.id}">Edit</a></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

/* ── products ── */
async function loadProducts() {
  const { data, error } = await db.from('products')
    .select('*, product_images(id,path,position), product_variants(id,option_name,option_value,price_minor,stock,position), product_categories(category_id)')
    .order('created_at', { ascending: false });
  if (error) return toast(error.message, true);
  _products = (data || []).map(p => ({
    ...p,
    product_images: (p.product_images || []).sort((a,b) => a.position - b.position),
    product_variants: (p.product_variants || []).sort((a,b) => a.position - b.position),
  }));
  renderProducts();
  renderCategories();
}

function renderProducts() {
  const q = (document.getElementById('product-search').value || '').toLowerCase().trim();
  const list = q ? _products.filter(p => (p.name + ' ' + p.slug).toLowerCase().includes(q)) : _products;
  document.getElementById('products-count').textContent =
    _products.length + ' total · ' + _products.filter(p => p.status === 'published').length + ' live';

  const box = document.getElementById('products-body');
  if (!list.length) {
    box.innerHTML = `<div class="empty">${q ? 'Nothing matches that search.' : 'No products yet. Add your first piece.'}</div>`;
    return;
  }
  box.innerHTML = `<table><thead><tr><th style="width:60px;"></th><th>Product</th><th class="hide-sm">Price</th><th class="hide-sm">Stock</th><th>Status</th><th></th></tr></thead><tbody>` +
    list.map(p => {
      const img = p.product_images[0];
      const stock = p.product_variants.reduce((s,v) => s + (v.stock || 0), 0);
      const cat = _categories.find(c => (p.product_categories || []).some(pc => pc.category_id === c.id));
      return `<tr>
        <td>${img ? `<img class="thumb" src="${esc(IMG(img.path))}" alt=""/>` : '<div class="thumb"></div>'}</td>
        <td>
          <div style="font-weight:500;">${esc(p.name)}</div>
          <div class="muted">${esc(cat ? cat.name : 'Uncategorised')}${p.is_featured ? ' · Featured' : ''}</div>
        </td>
        <td class="hide-sm">${M.fmt(p.price_minor, p.currency)}</td>
        <td class="hide-sm">${stock === 0 ? '<span class="pill pill--red">Sold out</span>' : (stock <= 3 ? `<span class="pill pill--warn">${stock} left</span>` : `<span class="muted">${stock}</span>`)}</td>
        <td>${p.status === 'published' ? '<span class="pill pill--live">Live</span>'
            : p.status === 'draft' ? '<span class="pill pill--draft">Draft</span>'
            : '<span class="pill pill--draft">Archived</span>'}</td>
        <td style="text-align:right;"><button class="btn btn--sm" onclick="openProduct('${p.id}')">Edit</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

const slugify = s => String(s).toLowerCase().trim()
  .replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);

function autoSlug() {
  const slug = document.getElementById('p-slug');
  if (!_editProduct && !slug.dataset.touched) slug.value = slugify(document.getElementById('p-name').value);
}
document.getElementById('p-slug').addEventListener('input', e => { e.target.dataset.touched = '1'; });

function openProduct(id) {
  _editProduct = id ? _products.find(p => p.id === id) : null;
  const p = _editProduct;
  document.getElementById('product-modal-title').textContent = p ? 'Edit product' : 'New product';
  document.getElementById('p-name').value        = p?.name || '';
  document.getElementById('p-slug').value        = p?.slug || '';
  document.getElementById('p-slug').dataset.touched = p ? '1' : '';
  document.getElementById('p-subtitle').value    = p?.subtitle || '';
  document.getElementById('p-price').value       = p ? M.toMajor(p.price_minor) : '';
  document.getElementById('p-status').value      = p?.status || 'draft';
  document.getElementById('p-featured').value    = String(p?.is_featured ?? false);
  document.getElementById('p-description').value = p?.description || '';
  document.getElementById('p-details').value     = p?.details || '';
  document.getElementById('p-category').value    = p ? ((p.product_categories || [])[0]?.category_id || '') : '';
  document.getElementById('p-delete').style.display = p ? '' : 'none';

  _pImages = p ? p.product_images.map(i => ({ ...i })) : [];
  _pVariants = p && p.product_variants.length
    ? p.product_variants.map(v => ({ ...v }))
    : [{ option_name: 'Size', option_value: 'One Size', stock: 0, price_minor: null }];
  renderImages();
  renderVariants();
  openModal('product-modal');
}

function renderImages() {
  const box = document.getElementById('p-images');
  box.innerHTML = _pImages.map((im, i) =>
    `<figure><img src="${esc(IMG(im.path))}" alt=""/><button class="x" onclick="removeImage(${i})">×</button></figure>`
  ).join('') + `<div class="drop" onclick="document.getElementById('p-image-file').click()">+</div>`;
}
function removeImage(i){ _pImages.splice(i,1); renderImages(); }

async function uploadImages(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  toast('Uploading…');
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) { toast(file.name + ' is over 10 MB', true); continue; }
    const safe = file.name.replace(/[^\w.\-]+/g, '_').slice(-50);
    const path = `${slugify(document.getElementById('p-name').value || 'product')}/${Date.now()}-${safe}`;
    const { error } = await db.storage.from('product-images').upload(path, file, { contentType: file.type });
    if (error) { toast(error.message, true); continue; }
    _pImages.push({ path, position: _pImages.length });
  }
  renderImages();
  toast('Images added — remember to save');
}

function renderVariants() {
  document.getElementById('p-variants').innerHTML = _pVariants.map((v, i) => `
    <div class="variant">
      <input class="inp" style="max-width:110px;" value="${esc(v.option_name || 'Size')}" oninput="_pVariants[${i}].option_name=this.value" placeholder="Size"/>
      <input class="inp" value="${esc(v.option_value || '')}" oninput="_pVariants[${i}].option_value=this.value" placeholder="One Size"/>
      <input class="inp" style="max-width:96px;" type="number" min="0" value="${v.stock ?? 0}" oninput="_pVariants[${i}].stock=parseInt(this.value||'0',10)" placeholder="Stock"/>
      <input class="inp" style="max-width:120px;" inputmode="decimal" value="${v.price_minor != null ? M.toMajor(v.price_minor) : ''}" oninput="_pVariants[${i}]._price=this.value" placeholder="Price override"/>
      <button class="btn btn--sm btn--danger" onclick="_pVariants.splice(${i},1);renderVariants();">×</button>
    </div>`).join('');
}
function addVariantRow(){ _pVariants.push({ option_name:'Size', option_value:'', stock:0, price_minor:null }); renderVariants(); }

async function saveProduct() {
  const name = document.getElementById('p-name').value.trim();
  if (!name) return toast('Name is required', true);
  const price = M.toMinor(document.getElementById('p-price').value);
  if (!price) return toast('Set a price', true);
  if (!_pVariants.length) return toast('Add at least one size', true);

  const row = {
    name,
    slug: slugify(document.getElementById('p-slug').value || name),
    subtitle: document.getElementById('p-subtitle').value.trim() || null,
    description: document.getElementById('p-description').value.trim() || null,
    details: document.getElementById('p-details').value.trim() || null,
    price_minor: price,
    currency: _settings.currency || 'NGN',
    status: document.getElementById('p-status').value,
    is_featured: document.getElementById('p-featured').value === 'true',
    updated_at: new Date().toISOString(),
  };

  let pid = _editProduct?.id;
  if (pid) {
    const { error } = await db.from('products').update(row).eq('id', pid);
    if (error) return toast(error.message, true);
  } else {
    const { data, error } = await db.from('products').insert(row).select('id').single();
    if (error) return toast(error.message, true);
    pid = data.id;
  }

  /* Images and variants are replaced wholesale — simpler than diffing, and the
     row counts here are small. */
  await db.from('product_images').delete().eq('product_id', pid);
  if (_pImages.length) {
    const { error } = await db.from('product_images')
      .insert(_pImages.map((im, i) => ({ product_id: pid, path: im.path, position: i })));
    if (error) return toast(error.message, true);
  }

  const keepIds = _pVariants.filter(v => v.id).map(v => v.id);
  let del = db.from('product_variants').delete().eq('product_id', pid);
  if (keepIds.length) del = del.not('id', 'in', `(${keepIds.join(',')})`);
  await del;

  for (let i = 0; i < _pVariants.length; i++) {
    const v = _pVariants[i];
    const body = {
      product_id: pid,
      option_name: (v.option_name || 'Size').trim() || 'Size',
      option_value: (v.option_value || 'One Size').trim() || 'One Size',
      stock: Math.max(0, parseInt(v.stock || 0, 10)),
      price_minor: v._price !== undefined ? (M.toMinor(v._price) || null) : (v.price_minor ?? null),
      position: i,
    };
    const { error } = v.id
      ? await db.from('product_variants').update(body).eq('id', v.id)
      : await db.from('product_variants').insert(body);
    if (error) return toast(error.message, true);
  }

  const cat = document.getElementById('p-category').value;
  await db.from('product_categories').delete().eq('product_id', pid);
  if (cat) await db.from('product_categories').insert({ product_id: pid, category_id: cat });

  closeModal('product-modal');
  await loadProducts();
  toast('Product saved');
}

async function deleteProduct() {
  if (!_editProduct) return;
  if (!confirm(`Delete "${_editProduct.name}"? This cannot be undone.`)) return;
  const { error } = await db.from('products').delete().eq('id', _editProduct.id);
  if (error) return toast(error.message, true);
  closeModal('product-modal');
  await loadProducts();
  toast('Product deleted');
}

/* ── customers ── */
let _customers = [], _editCustomer = null;

async function loadCustomers() {
  const { data, error } = await db.rpc('admin_list_customers');
  if (error) return toast(error.message, true);
  _customers = data || [];
  renderCustomers();
}

function renderCustomers() {
  const q = (document.getElementById('customer-search').value || '').trim().toLowerCase();
  const f = document.getElementById('customer-filter').value;

  let list = _customers;
  if (q) list = list.filter(c =>
    ((c.full_name || '') + ' ' + (c.email || '') + ' ' + (c.phone || '')).toLowerCase().includes(q));
  if (f === 'active')  list = list.filter(c => !c.is_blocked);
  if (f === 'blocked') list = list.filter(c => c.is_blocked);
  if (f === 'buyers')  list = list.filter(c => c.orders_count > 0);

  const spent = _customers.reduce((s, c) => s + Number(c.orders_total_minor || 0), 0);
  document.getElementById('customers-stats').innerHTML = `
    <div><b>${_customers.length}</b><span>Customers</span></div>
    <div><b>${_customers.filter(c => c.orders_count > 0).length}</b><span>Have ordered</span></div>
    <div><b>${M.fmt(spent, _settings.currency)}</b><span>Lifetime value</span></div>
    <div class="${_customers.some(c => c.is_blocked) ? 'bad' : ''}">
      <b>${_customers.filter(c => c.is_blocked).length}</b><span>Blocked</span></div>`;

  const blocked = _customers.filter(c => c.is_blocked).length;
  document.getElementById('customers-count').textContent =
    _customers.length + ' total' + (blocked ? ` · ${blocked} blocked` : '');

  const box = document.getElementById('customers-body');
  if (!list.length) {
    box.innerHTML = `<div class="empty">${q || f ? 'Nobody matches that.' : 'No customers yet.'}</div>`;
    return;
  }

  box.innerHTML = `<table><thead><tr>
      <th>Customer</th><th class="hide-sm">Phone</th><th>Orders</th>
      <th class="hide-sm">Spent</th><th>Status</th><th></th>
    </tr></thead><tbody>` +
    list.map(c => `<tr>
      <td>
        <div style="font-weight:500;">${esc(c.full_name || '—')}</div>
        <div class="muted">${esc(c.email || '')}</div>
      </td>
      <td class="hide-sm muted">${esc(c.phone || '—')}</td>
      <td class="muted">${c.orders_count}</td>
      <td class="hide-sm">${c.orders_total_minor > 0
        ? M.fmt(c.orders_total_minor, _settings.currency) : '<span class="muted">—</span>'}</td>
      <td>${c.is_staff  ? '<span class="pill pill--live">Staff</span>'
          : c.is_blocked ? '<span class="pill pill--red">Blocked</span>'
          : !c.email_confirmed ? '<span class="pill pill--warn">Unconfirmed</span>'
          : '<span class="pill pill--live">Active</span>'}</td>
      <td style="text-align:right;">
        <button class="btn btn--sm" onclick="openCustomer('${c.id}')">View</button></td>
    </tr>`).join('') + '</tbody></table>';
}

const when = t => t ? new Date(t).toLocaleString('en-NG',
  { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : 'Never';

function openCustomer(id) {
  _editCustomer = _customers.find(c => c.id === id);
  if (!_editCustomer) return;
  const c = _editCustomer;

  document.getElementById('customer-modal-title').textContent = c.full_name || c.email || 'Customer';
  document.getElementById('customer-detail').innerHTML = `
    <div class="grid">
      <div><label class="f">Email</label><input class="inp" value="${esc(c.email || '')}" disabled/></div>
      <div><label class="f">Phone</label><input class="inp" value="${esc(c.phone || '—')}" disabled/></div>
      <div><label class="f">Joined</label><input class="inp" value="${esc(when(c.created_at))}" disabled/></div>
      <div><label class="f">Last signed in</label><input class="inp" value="${esc(when(c.last_sign_in_at))}" disabled/></div>
    </div>
    <div class="stat" style="margin:16px 0 0;">
      <div><b>${c.orders_count}</b><span>Orders</span></div>
      <div><b>${M.fmt(c.orders_total_minor, _settings.currency)}</b><span>Spent</span></div>
      <div><b>${c.addresses_count}</b><span>Addresses</span></div>
      <div class="${c.is_blocked ? 'bad' : ''}"><b>${
        c.is_staff ? 'Staff' : c.is_blocked ? 'Blocked' : c.email_confirmed ? 'Active' : 'Unconfirmed'
      }</b><span>Status</span></div>
    </div>
    <p class="muted" style="font-size:12px;margin-top:14px;">
      ${c.last_order_at ? 'Last ordered ' + esc(when(c.last_order_at)) + '.' : 'Has never ordered.'}
      Blocking refuses sign-in and ends any session they have open. Deleting removes
      the account and its saved addresses; their orders stay in your records.
    </p>`;

  const blockBtn = document.getElementById('cu-block');
  const delBtn = document.getElementById('cu-delete');
  /* Staff are managed in the database, not here — offering the buttons would
     only produce an error message. */
  blockBtn.style.display = c.is_staff ? 'none' : '';
  delBtn.style.display   = c.is_staff ? 'none' : '';
  blockBtn.textContent   = c.is_blocked ? 'Unblock' : 'Block';
  openModal('customer-modal');
}

async function toggleBlock() {
  if (!_editCustomer) return;
  const c = _editCustomer;
  const next = !c.is_blocked;
  if (next && !confirm(`Block ${c.full_name || c.email}? They will not be able to sign in, and any open session ends now.`)) return;

  const { error } = await db.rpc('admin_set_customer_blocked', { p_user: c.id, p_blocked: next });
  if (error) return toast(error.message, true);
  closeModal('customer-modal');
  await loadCustomers();
  toast(next ? 'Account blocked' : 'Account unblocked');
}

async function deleteCustomer() {
  if (!_editCustomer) return;
  const c = _editCustomer;
  if (!confirm(`Delete ${c.full_name || c.email}? This cannot be undone.\n\nTheir ${c.orders_count} order(s) stay in your records, but the account, its saved addresses and cart are removed.`)) return;

  const { error } = await db.rpc('admin_delete_customer', { p_user: c.id });
  if (error) return toast(error.message, true);
  closeModal('customer-modal');
  await loadCustomers();
  toast('Account deleted');
}

/* ── orders ── */
async function loadOrders() {
  const { data, error } = await db.from('orders')
    .select('*, order_items(id,product_name,option_label,quantity,unit_price_minor,line_total_minor,image_path)')
    .order('placed_at', { ascending: false }).limit(300);
  if (error) return toast(error.message, true);
  _orders = data || [];
  renderOrders();
}

const ORDER_PILL = {
  pending:'pill--warn', paid:'pill--live', packed:'pill--live', shipped:'pill--live',
  delivered:'pill--live', cancelled:'pill--red', refunded:'pill--red',
};

function renderOrders() {
  const f = document.getElementById('order-filter').value;
  const list = f ? _orders.filter(o => o.status === f) : _orders;
  const pending = _orders.filter(o => o.status === 'pending').length;
  document.getElementById('orders-count').textContent =
    _orders.length + ' total' + (pending ? ` · ${pending} awaiting payment` : '');

  const box = document.getElementById('orders-body');
  if (!list.length) { box.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>Order</th><th class="hide-sm">Placed</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>` +
    list.map(o => `<tr>
      <td><div style="font-weight:500;">${esc(o.order_number)}</div><div class="muted">${esc(o.email || '')}</div></td>
      <td class="hide-sm muted">${new Date(o.placed_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</td>
      <td class="muted">${(o.order_items||[]).reduce((s,i)=>s+i.quantity,0)}</td>
      <td>${M.fmt(o.total_minor, o.currency)}</td>
      <td><span class="pill ${ORDER_PILL[o.status]||'pill--draft'}">${esc(o.status)}</span></td>
      <td style="text-align:right;"><button class="btn btn--sm" onclick="openOrder('${o.id}')">View</button></td>
    </tr>`).join('') + '</tbody></table>';
}

let _editOrder = null;
function openOrder(id) {
  const o = _orders.find(x => x.id === id); if (!o) return;
  _editOrder = o;
  const a = o.shipping_address || {};
  document.getElementById('order-modal-title').textContent = o.order_number;
  document.getElementById('order-detail').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <span class="pill ${ORDER_PILL[o.status]||'pill--draft'}">${esc(o.status)}</span>
      <span class="pill ${o.payment_status==='paid'?'pill--live':'pill--warn'}">payment ${esc(o.payment_status)}</span>
    </div>
    <div class="card" style="margin-bottom:14px;">
      ${(o.order_items||[]).map(i => `
        <div style="display:flex;gap:11px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--b);">
          ${i.image_path ? `<img class="thumb" src="${esc(IMG(i.image_path))}" alt=""/>` : '<div class="thumb"></div>'}
          <div style="flex:1;min-width:0;">
            <div style="font-weight:500;">${esc(i.product_name)}</div>
            <div class="muted">${esc(i.option_label||'')} · ${i.quantity} × ${M.fmt(i.unit_price_minor,o.currency)}</div>
          </div>
          <div>${M.fmt(i.line_total_minor,o.currency)}</div>
        </div>`).join('')}
      <div style="padding:11px 13px;display:flex;justify-content:space-between;"><span class="muted">Subtotal</span><span>${M.fmt(o.subtotal_minor,o.currency)}</span></div>
      <div style="padding:0 13px 11px;display:flex;justify-content:space-between;"><span class="muted">Shipping</span><span>${o.shipping_minor ? M.fmt(o.shipping_minor,o.currency) : 'Free'}</span></div>
      <div style="padding:11px 13px;display:flex;justify-content:space-between;border-top:1px solid var(--b);font-weight:600;"><span>Total</span><span>${M.fmt(o.total_minor,o.currency)}</span></div>
    </div>
    <div style="font-size:12.5px;line-height:1.7;color:var(--sub);margin-bottom:16px;">
      <strong style="color:var(--text);">${esc(a.full_name||'')}</strong><br/>
      ${esc(a.line1||'')}${a.line2 ? '<br/>'+esc(a.line2) : ''}<br/>
      ${esc(a.city||'')}${a.state ? ', '+esc(a.state) : ''} ${esc(a.postal_code||'')}<br/>
      ${esc(a.country||'')}${a.phone ? '<br/>'+esc(a.phone) : ''}
    </div>
    <label class="f">Move to</label>
    <div style="display:flex;gap:7px;flex-wrap:wrap;">
      ${['paid','packed','shipped','delivered','cancelled','refunded']
        .map(s => `<button class="btn btn--sm${s==='cancelled'||s==='refunded'?' btn--danger':''}" onclick="setOrderStatus('${s}')">${s}</button>`).join('')}
    </div>`;
  openModal('order-modal');
}

async function setOrderStatus(status) {
  if (!_editOrder) return;
  if ((status === 'cancelled' || status === 'refunded') &&
      !confirm(`Mark ${_editOrder.order_number} as ${status}? Stock goes back to the shelf.`)) return;

  /* Status changes go through a function so the restock happens in the same
     transaction and only once, whatever the client does. */
  const { error } = await db.rpc('admin_set_order_status', { p_order: _editOrder.id, p_status: status });
  if (error) return toast(error.message, true);

  if (status === 'paid') {
    await db.from('orders').update({ payment_status: 'paid' }).eq('id', _editOrder.id);
  }
  closeModal('order-modal');
  await Promise.all([loadOrders(), loadProducts()]);
  toast('Order marked ' + status);
}
</script>
