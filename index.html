<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rex-Giddoty Hubs</title>
<meta name="description" content="Considered pieces, made to be kept."/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="nav" data-nav></header>

<section class="hero" id="hero">
  <div class="hero__body">
    <div class="wrap">
      <div class="eyebrow" id="hero-eyebrow">New</div>
      <h1 class="display" id="hero-heading">The New Collection</h1>
      <p id="hero-sub" style="max-width:440px;font-size:15px;">Crafted without compromise</p>
      <a class="btn" href="/shop.html">Discover</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section__head">
      <div>
        <div class="eyebrow" style="margin-bottom:10px;">Selected</div>
        <h2 class="display">Featured pieces</h2>
      </div>
      <a href="/shop.html" style="font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px;">View all</a>
    </div>
    <div class="grid" id="featured"></div>
  </div>
</section>

<section class="section" id="cats-section" style="padding-top:0;display:none;">
  <div class="wrap">
    <div class="section__head"><h2 class="display">The collections</h2></div>
    <div class="grid" id="cats"></div>
  </div>
</section>

<footer class="foot" data-foot></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC, IMG = window.RG_IMG;

(async () => {
  await window.RG_CHROME();
  const s = await window.RG_SETTINGS();
  if (s.hero_heading)    document.getElementById('hero-heading').textContent = s.hero_heading;
  if (s.hero_subheading) document.getElementById('hero-sub').textContent     = s.hero_subheading;

  /* The hero image is the first image of a featured piece — no separate asset
     to manage, and it changes as soon as the collection does. */
  const { data: featured } = await db.from('products')
    .select('id,slug,name,price_minor,currency,is_featured,product_images(path,position),product_variants(stock)')
    .eq('status','published').eq('is_featured', true).order('position').limit(8);

  const { data: latest } = await db.from('products')
    .select('id,slug,name,price_minor,currency,product_images(path,position),product_variants(stock)')
    .eq('status','published').order('created_at',{ascending:false}).limit(8);

  const list = (featured && featured.length) ? featured : (latest || []);
  const grid = document.getElementById('featured');

  if (!list.length) {
    grid.outerHTML = `<div class="empty-state">
      <h2 class="display">The collection is being prepared</h2>
      <p>Publish a product in operations and it will appear here.</p>
    </div>`;
  } else {
    grid.innerHTML = list.map(window.RG_CARD).join('');
    const heroImgs = (list[0].product_images || []).sort((a,b)=>a.position-b.position);
    if (heroImgs[0]) {
      const hero = document.getElementById('hero');
      const img = document.createElement('img');
      img.src = IMG(heroImgs[0].path); img.alt = '';
      hero.insertBefore(img, hero.firstChild);
      hero.classList.add('hero--dark');
    } else {
      document.getElementById('hero').classList.add('hero--plain');
    }
  }

  const { data: cats } = await db.from('categories')
    .select('slug,name,description').eq('is_active', true).order('position').order('name');
  if (cats && cats.length) {
    document.getElementById('cats-section').style.display = '';
    document.getElementById('cats').innerHTML = cats.map(c => `
      <a class="product-card" href="/shop.html?category=${encodeURIComponent(c.slug)}">
        <div class="card__media" style="aspect-ratio:1/1;display:flex;align-items:flex-end;padding:18px;">
          <span class="display" style="font-size:24px;">${esc(c.name)}</span>
        </div>
      </a>`).join('');
  }
})();
</script>
</body>
</html>
