<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rex-Giddoty Hubs — Online Shopping</title>
<meta name="description" content="Shop clothes, bags, shoes, jewellery and more. Nationwide delivery."/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="shell">
  <aside class="box rail-box" data-rail></aside>

  <main>
    <section class="hero" id="hero">
      <div class="hero__txt">
        <h1 id="hero-h">Everything you need</h1>
        <p id="hero-p">Delivered across Nigeria</p>
        <a class="btn" href="/shop.html">Shop now</a>
      </div>
    </section>

    <section class="sect" id="flash-sect" style="display:none;">
      <div class="sect__hd">
        <h2 id="flash-title">Flash Sales</h2>
        <div class="countdown" id="countdown"></div>
        <a href="/shop.html?deals=1">See all ›</a>
      </div>
      <div class="pgrid" id="flash"></div>
    </section>

    <section class="sect">
      <div class="sect__hd"><h2>New Arrivals</h2><a href="/shop.html?new=1">See all ›</a></div>
      <div class="pgrid" id="newest"></div>
    </section>

    <section class="sect" id="cats-sect" style="display:none;">
      <div class="sect__hd sect__hd--plain"><h2>Shop by category</h2><a href="/shop.html">See all ›</a></div>
      <div class="pgrid" id="cats" style="background:var(--paper);gap:0;"></div>
    </section>

    <section class="sect">
      <div class="sect__hd sect__hd--plain"><h2>Recommended for you</h2><a href="/shop.html">See all ›</a></div>
      <div class="pgrid" id="reco"></div>
    </section>
  </main>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC, IMG = window.RG_IMG;
const SEL = 'id,slug,name,price_minor,compare_at_minor,currency,badge,rating_avg,rating_count,created_at,product_images(path,position),product_variants(id,stock)';

(async () => {
  await window.RG_CHROME();
  const s = await window.RG_SETTINGS();

  if (s.hero_heading)    document.getElementById('hero-h').textContent = s.hero_heading;
  if (s.hero_subheading) document.getElementById('hero-p').textContent = s.hero_subheading;

  const { data: all } = await db.from('products').select(SEL)
    .eq('status','published').order('created_at',{ascending:false}).limit(48);
  const list = all || [];

  if (!list.length) {
    document.querySelector('main').innerHTML = `<div class="box empty">
      <h2>No products yet</h2>
      <p>Publish a product in operations and it will appear here.</p>
      <a class="btn" href="/ops-login.html">Go to operations</a></div>`;
    return;
  }

  /* hero art comes from the newest piece with a photo — nothing extra to manage */
  const withImg = list.find(p => (p.product_images || []).length);
  if (withImg) {
    const imgs = withImg.product_images.sort((a,b)=>a.position-b.position);
    const hero = document.getElementById('hero');
    const im = document.createElement('img');
    im.src = IMG(imgs[0].path); im.alt = '';
    hero.insertBefore(im, hero.firstChild);
    hero.classList.add('hero--img');
  }

  const deals = list.filter(p => p.compare_at_minor && p.compare_at_minor > p.price_minor);
  if (deals.length) {
    document.getElementById('flash-sect').style.display = '';
    document.getElementById('flash-title').textContent = s.flash_title || 'Flash Sales';
    document.getElementById('flash').innerHTML = deals.slice(0,12).map(window.RG_CARD).join('');
    startCountdown(s.flash_ends_at);
  }

  document.getElementById('newest').innerHTML = list.slice(0,12).map(window.RG_CARD).join('');
  document.getElementById('reco').innerHTML =
    list.slice().sort(() => Math.random() - .5).slice(0,12).map(window.RG_CARD).join('');

  const cats = await window.RG_CATS();
  if (cats.length) {
    document.getElementById('cats-sect').style.display = '';
    document.getElementById('cats').innerHTML = cats.map(c => `
      <a class="pcard" href="/shop.html?category=${encodeURIComponent(c.slug)}" style="text-align:center;">
        <div class="pcard__media" style="border-radius:50%;overflow:hidden;"></div>
        <div class="pcard__name" style="height:auto;text-align:center;font-weight:500;">${esc(c.name)}</div>
      </a>`).join('');
  }
})();

function startCountdown(endsAt) {
  const el = document.getElementById('countdown');
  /* No end date configured means no clock, rather than a fake one. */
  if (!endsAt) { el.style.display = 'none'; return; }
  const end = new Date(endsAt).getTime();
  if (isNaN(end)) { el.style.display = 'none'; return; }
  const tick = () => {
    let d = Math.max(0, end - Date.now());
    if (!d) { el.textContent = 'Ended'; return; }
    const h = String(Math.floor(d/3.6e6)).padStart(2,'0');
    const m = String(Math.floor(d%3.6e6/6e4)).padStart(2,'0');
    const sec = String(Math.floor(d%6e4/1000)).padStart(2,'0');
    el.innerHTML = `Ends in <b>${h}</b><b>${m}</b><b>${sec}</b>`;
  };
  tick(); setInterval(tick, 1000);
}
</script>
</body>
</html>
