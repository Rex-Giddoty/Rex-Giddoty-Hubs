<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rex-Giddoty Hubs — Online Shopping for Fashion, Bags, Shoes &amp; More</title>
<meta name="description" content="Shop clothes, bags, shoes, jewellery, decor and lifestyle. Best prices, nationwide delivery, pay on confirmation."/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#9030d0"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Rex-Giddoty"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr>
  <div class="skhdr">
    <div class="sk skhdr__logo"></div>
    <div class="sk skhdr__search"></div>
    <div class="sk skhdr__act"></div>
    <div class="sk skhdr__act"></div>
  </div>
</header>

<div class="shell">
  <aside class="box rail-box" data-rail>
    <div class="skrail">
      <div class="sk sk--dark skrail__cap"></div>
      <div class="sk skrail__row"></div><div class="sk skrail__row"></div>
      <div class="sk skrail__row"></div><div class="sk skrail__row"></div>
      <div class="sk skrail__row"></div><div class="sk skrail__row"></div>
      <div class="sk skrail__row" style="margin-bottom:14px;"></div>
    </div>
  </aside>

  <main>
    <!-- slider + service cards -->
    <section class="topblock">
      <div class="slider" id="slider">
        <div class="slider__track" id="sl-track"><div class="sk skhero"></div></div>
        <button class="slider__nav _p" id="sl-prev" aria-label="Previous"></button>
        <button class="slider__nav _n" id="sl-next" aria-label="Next"></button>
        <div class="slider__dots" id="sl-dots"></div>
      </div>

      <div class="svc">
        <div class="svc__card" id="svc-card">
          <div class="sksvc">
            <div class="sk sksvc__row"></div>
            <div class="sk sksvc__row"></div>
            <div class="sk sksvc__row"></div>
          </div>
        </div>
        <a class="svc__promo" href="/shop.html?deals=1">
          <b>Deals of the day</b><span>Up to 70% off selected items</span>
        </a>
      </div>
    </section>

    <!-- what the rows look like before any of them have data -->
    <section class="sect" id="boot-sect">
      <div class="sk skhd"></div>
      <div class="skgrid">
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
        <div><div class="sk skcard__img"></div><div class="sk skcard__l1"></div><div class="sk skcard__l2"></div><div class="sk skcard__p"></div></div>
      </div>
    </section>

    <!-- category thumbnails -->
    <section class="sect" id="thumbs-sect" style="display:none;">
      <div class="thumbs" id="thumbs"></div>
    </section>

    <!-- flash sales -->
    <section class="sect" id="flash-sect" style="display:none;">
      <div class="sect__hd sect__hd--flash">
        <h2 id="flash-title">Flash Sales</h2>
        <div class="countdown" id="countdown"></div>
        <a href="/shop.html?deals=1">See All ›</a>
      </div>
      <div id="flash"></div>
    </section>

    <!-- category tiles -->
    <section class="sect" id="cats-sect" style="display:none;">
      <div class="sect__hd" style="background:#e7d5f7;justify-content:center;">
        <!-- flex:0 would collapse the heading to zero width, and the stylesheet's
             overflow:hidden would then clip the text away completely -->
        <h2 style="flex:0 1 auto;text-align:center;">All Your Essentials in One Place</h2>
      </div>
      <div class="freelinks" id="cats"></div>
    </section>

    <!-- top sellers -->
    <section class="sect" id="top-sect" style="display:none;">
      <div class="sect__hd"><h2>Top Sellers</h2><a href="/shop.html">See All ›</a></div>
      <div id="top"></div>
    </section>

    <!-- limited stock -->
    <section class="sect" id="limited-sect" style="display:none;">
      <div class="sect__hd"><h2>Limited Stock deals <span class="sub">| Going fast</span></h2><a href="/shop.html">See All ›</a></div>
      <div class="pgrid" id="limited"></div>
    </section>

    <!-- per-category rows -->
    <div id="cat-rows"></div>

    <!-- recommended -->
    <section class="sect" id="reco-sect" style="display:none;">
      <div class="sect__hd sect__hd--plain"><h2>Recommended for you</h2><a href="/shop.html">See All ›</a></div>
      <div class="pgrid" id="reco"></div>
    </section>

    <!-- store copy -->
    <section class="sect">
      <div class="seo" id="seo"></div>
    </section>
  </main>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC, IMG = window.RG_IMG, I = window.RG_ICON;
const SEL = 'id,slug,name,price_minor,compare_at_minor,currency,badge,rating_avg,rating_count,sold_count,created_at,product_images(path,position),product_variants(id,stock,price_minor)';
const img1 = p => { const a = (p.product_images||[]).slice().sort((x,y)=>x.position-y.position); return a[0] ? IMG(a[0].path) : null; };
const stockOf = p => (p.product_variants||[]).reduce((s,v)=>s+(v.stock||0),0);

/* The stand-in row goes the moment any real row is ready — and after eight
   seconds regardless, because a shimmer that never stops is worse than the
   empty page it replaced. */
setTimeout(() => bootDone(), 8000);

/* The stand-in row goes the moment any real row is ready. */
let _bootGone = false;
function bootDone() {
  if (_bootGone) return;
  _bootGone = true;
  const el = document.getElementById('boot-sect');
  if (el) el.remove();
}

(async () => {
  await window.RG_CHROME();
  const s = await window.RG_SETTINGS();
  const store = s.store_name || 'Rex-Giddoty Hubs';

  document.getElementById('svc-card').innerHTML = `
    <a class="svc__item" href="mailto:${esc(s.support_email || 'support@example.com')}">
      ${I.phone}<div><div class="svc__t">CALL TO ORDER</div><div class="svc__s">${esc(s.support_phone || 'Message us anytime')}</div></div></a>
    <a class="svc__item" href="/shop.html">
      ${I.truck}<div><div class="svc__t">Nationwide delivery</div><div class="svc__s">Fast and tracked</div></div></a>
    <a class="svc__item" href="/shop.html">
      ${I.shield}<div><div class="svc__t">Pay on confirmation</div><div class="svc__s">Seamless process</div></div></a>`;

  document.getElementById('seo').innerHTML = `
    <h1>${esc(store)} — shop everything in one place</h1>
    <p>${esc(store)} brings clothes, bags, shoes, jewellery, decor and lifestyle pieces together in a single
    store, so you can find what you need without hopping between shops. Browse by category, compare prices at a
    glance and check out in a couple of taps.</p>
    <h2>Best prices, every day</h2>
    <p>Watch the <a href="/shop.html?deals=1">deals</a> section for reductions, and
    <a href="/shop.html?new=1">new arrivals</a> for the latest pieces as they land. Every order is confirmed
    before dispatch and delivered nationwide.</p>`;

  const { data: all } = await db.from('products').select(SEL)
    .eq('status','published').order('created_at',{ascending:false}).limit(96);
  const list = all || [];

  if (!list.length) {
    document.querySelector('main').innerHTML = `<div class="box empty">
      <h2>No products yet</h2>
      <p>Publish a product in operations and it will appear here.</p>
      <a class="btn" href="/ops-login.html">Go to operations</a></div>`;
    buildSlides([], s);
    return;
  }

  buildSlides(list, s);

  /* ── category membership ──
     One query, grouped here, rather than a round trip per category. Only
     top-level categories get a tile; a parent counts everything filed under
     its children as its own. */
  const cats = await window.RG_CAT_TREE();
  const { data: pcs } = await db.from('product_categories')
    .select('product_id,category_id').in('product_id', list.map(p => p.id));
  const byCat = new Map();
  for (const r of (pcs || [])) {
    if (!byCat.has(r.category_id)) byCat.set(r.category_id, new Set());
    byCat.get(r.category_id).add(r.product_id);
  }
  const idsFor = node => {
    const out = new Set(byCat.get(node.id) || []);
    for (const k of (node.children || [])) for (const id of (byCat.get(k.id) || [])) out.add(id);
    return out;
  };

  /* Card art, in order of preference: the image uploaded for the category in
     ops, then a photo of something actually in it. Never a photo borrowed from
     an unrelated category — that is what made every card look the same. When
     there is nothing, the caller falls back to the category's own icon. */
  const artFor = node => {
    if (node.image_path) return IMG(node.image_path);
    const ids = idsFor(node);
    const hit = list.find(p => ids.has(p.id) && img1(p));
    return hit ? img1(hit) : null;
  };

  if (cats.length) {
    document.getElementById('thumbs-sect').style.display = ''; bootDone();
    const ICO = window.RG_CAT_ICON;
    document.getElementById('thumbs').innerHTML = [
      { name:'Deals', href:'/shop.html?deals=1', slug:'__deals', img:null },
      { name:'New Arrivals', href:'/shop.html?new=1', slug:'__new', img:null },
    ].concat(cats.map(c => ({ name:c.name, slug:c.slug,
                              href:'/shop.html?category='+encodeURIComponent(c.slug),
                              img:artFor(c) })))
     .map(t => `<a class="thumb" href="${t.href}">
        <div class="thumb__img">${t.img
          ? `<img src="${esc(t.img)}" alt="" loading="lazy"/>`
          : `<span class="ico">${ICO(t.slug, t.name)}</span>`}</div>
        <p>${esc(t.name)}</p></a>`).join('');

    document.getElementById('cats-sect').style.display = ''; bootDone();
    document.getElementById('cats').innerHTML = cats.slice(0,12).map(c => {
      const a = artFor(c);
      return `<a class="fl" href="/shop.html?category=${encodeURIComponent(c.slug)}">
        ${a ? `<img src="${esc(a)}" alt="" loading="lazy"/>`
            : `<span class="fl__ico">${ICO(c.slug, c.name)}</span>`}
        <span class="fl__cap">${esc(c.name)}</span></a>`;
    }).join('');
  }

  /* ── flash sales ── */
  const deals = list.filter(p => p.compare_at_minor && p.compare_at_minor > p.price_minor);
  if (deals.length) {
    document.getElementById('flash-sect').style.display = ''; bootDone();
    document.getElementById('flash-title').textContent = s.flash_title || 'Flash Sales';
    document.getElementById('flash').innerHTML =
      window.RG_CRS(deals.slice(0,16).map(window.RG_CARD).join(''));
    startCountdown(s.flash_ends_at);
  }

  /* ── top sellers: best rated, then newest ── */
  const top = list.slice().sort((a,b) =>
    (Number(b.rating_avg)||0) - (Number(a.rating_avg)||0) ||
    (b.rating_count||0) - (a.rating_count||0));
  document.getElementById('top-sect').style.display = ''; bootDone();
  document.getElementById('top').innerHTML =
    window.RG_CRS(top.slice(0,16).map(window.RG_CARD).join(''));

  /* ── limited stock: genuinely low counts only ── */
  const low = list.filter(p => { const st = stockOf(p); return st > 0 && st <= 10; });
  if (low.length) {
    document.getElementById('limited-sect').style.display = ''; bootDone();
    document.getElementById('limited').innerHTML = low.slice(0,12).map(window.RG_CARD).join('');
  }

  /* ── one carousel per category ── */
  const rows = document.getElementById('cat-rows');
  /* Row headers cycle through tints of the brand purple rather than a rainbow,
     so a long page still reads as one shop. */
  const tint = ['#f0e4fb','#e7d5f7','#ede6f9','#f4ecfd','#e4dcf6','#f7f0fd'];
  let ti = 0;
  for (const c of cats) {
    const ids = idsFor(c);
    if (!ids.size) continue;
    const items = list.filter(p => ids.has(p.id)).slice(0, 16);
    if (items.length < 2) continue;

    const sec = document.createElement('section');
    sec.className = 'sect';
    sec.innerHTML = `
      <div class="sect__hd" style="background:${tint[ti++ % tint.length]};">
        <h2>${esc(c.name)}</h2>
        <a href="/shop.html?category=${encodeURIComponent(c.slug)}">See All ›</a>
      </div>
      ${window.RG_CRS(items.map(window.RG_CARD).join(''))}`;
    rows.appendChild(sec);
  }

  /* ── recommended ── */
  document.getElementById('reco-sect').style.display = ''; bootDone();
  document.getElementById('reco').innerHTML =
    list.slice().sort(() => Math.random() - .5).slice(0,12).map(window.RG_CARD).join('');
})().finally(bootDone);   /* an empty catalogue, or a failed query, must not shimmer for ever */

/* ── hero slider ── */
function buildSlides(list, s) {
  const shots = list.filter(img1).slice(0, 4);
  const slides = shots.length ? shots.map((p,i) => ({
    img: img1(p),
    h: i === 0 ? (s.hero_heading || 'Everything you need') : p.name,
    p: i === 0 ? (s.hero_subheading || 'Delivered across Nigeria') : 'Shop this piece',
    href: '/product.html?slug=' + encodeURIComponent(p.slug),
  })) : [{
    img: null,
    h: s.hero_heading || 'Everything you need',
    p: s.hero_subheading || 'Delivered across Nigeria',
    href: '/shop.html',
  }];

  const track = document.getElementById('sl-track');
  track.innerHTML = slides.map(sl => `
    <div class="slider__slide">
      ${sl.img ? `<img src="${esc(sl.img)}" alt=""/>` : ''}
      <div class="slider__cap">
        <h2>${esc(sl.h)}</h2><p>${esc(sl.p)}</p>
        <a class="btn" href="${sl.href}">Shop now</a>
      </div>
    </div>`).join('');

  const dots = document.getElementById('sl-dots');
  dots.innerHTML = slides.map((_,i) => `<i class="${i?'':'on'}" data-i="${i}"></i>`).join('');
  document.getElementById('sl-prev').innerHTML = window.RG_ICON.left;
  document.getElementById('sl-next').innerHTML = window.RG_ICON.right;

  let at = 0, timer;
  const go = n => {
    at = (n + slides.length) % slides.length;
    track.style.transform = `translateX(-${at * 100}%)`;
    dots.querySelectorAll('i').forEach((d,i) => d.classList.toggle('on', i === at));
  };
  const auto = () => { clearInterval(timer); if (slides.length > 1) timer = setInterval(() => go(at+1), 6000); };

  document.getElementById('sl-prev').onclick = () => { go(at-1); auto(); };
  document.getElementById('sl-next').onclick = () => { go(at+1); auto(); };
  dots.querySelectorAll('i').forEach(d => d.onclick = () => { go(Number(d.dataset.i)); auto(); });
  if (slides.length < 2) {
    document.getElementById('sl-prev').style.display = 'none';
    document.getElementById('sl-next').style.display = 'none';
    dots.style.display = 'none';
  }
  auto();
}

function startCountdown(endsAt) {
  const el = document.getElementById('countdown');
  /* No end date configured means no clock, rather than a fake one. */
  if (!endsAt) { el.style.display = 'none'; return; }
  const end = new Date(endsAt).getTime();
  if (isNaN(end)) { el.style.display = 'none'; return; }
  const tick = () => {
    const d = Math.max(0, end - Date.now());
    if (!d) { el.textContent = 'Ended'; return; }
    const h = String(Math.floor(d/3.6e6)).padStart(2,'0');
    const m = String(Math.floor(d%3.6e6/6e4)).padStart(2,'0');
    const sec = String(Math.floor(d%6e4/1000)).padStart(2,'0');
    el.innerHTML = `Time Left: <b>${h}h</b><b>${m}m</b><b>${sec}s</b>`;
  };
  tick(); setInterval(tick, 1000);
}
</script>
</body>
</html>
