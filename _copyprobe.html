<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/ops.css"/></head>
<body><div class="page active" style="padding:20px"><div id="thread-pane" class="thrpane"></div></div>
<div class="toast" id="toast"></div>
<script>
const esc = x => String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let _copied = null;
function toast(m){ _copied = _copied; document.getElementById('toast').textContent = m; }
function fileHtml(){ return ''; }
function toggleThreadOpen(){}
const _thread = 't1';
const _threads = [{ id:'t1', status:'open', full_name:'Amaka Obi', email:'amaka@example.com', phone:'0803' }];
const _tmsgs = [
  { id:'m1', sender_role:'customer', body:'Hi, is the black one still available in size 42?', created_at:'2026-08-14T09:10:00Z' },
  { id:'m2', sender_role:'staff', body:'Yes it is — shall I hold one for you?', created_at:'2026-08-14T09:12:00Z' },
  { id:'m3', sender_role:'customer', body:null, created_at:'2026-08-14T09:13:00Z' },
];
/* ── copying ──
 * The clipboard API needs a secure context and, in a WebView, a permission the
 * app may not have been given. The textarea route is ancient and ugly and works
 * where the modern one refuses, so it is kept as the fallback rather than
 * leaving staff with a button that silently does nothing.
 */
async function copyText(text, said) {
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    toast(said || 'Copied');
    return;
  } catch (_) { /* fall through */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    /* Off-screen rather than hidden: a display:none textarea cannot be selected,
       so the copy would fail for the one reason we are here. */
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? (said || 'Copied') : 'Could not copy — select the text instead', !ok);
  } catch (_) {
    toast('Could not copy — select the text instead', true);
  }
}

function copyThread() {
  const t = _threads.find(x => x.id === _thread);
  if (!t || !_tmsgs.length) return;

  const when = d => new Date(d).toLocaleString('en-NG',
    { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  /* Named rather than "us" and "them", because the point of copying it out is
     to be read somewhere this conversation has no context. */
  const who = m => m.sender_role === 'staff' ? 'Rex-Giddoty' : (t.full_name || t.email || 'Customer');
  const lines = _tmsgs.map(m =>
    `[${when(m.created_at)}] ${who(m)}: ${m.body || '(attachment)'}`);

  copyText([
    (t.full_name || 'Customer') + (t.email ? ' <' + t.email + '>' : ''),
    ''].concat(lines).join('\n'), _tmsgs.length + ' messages copied');
}

function renderThread() {
  const t = _threads.find(x => x.id === _thread);
  const pane = document.getElementById('thread-pane');
  if (!t) { pane.innerHTML = '<div class="empty">Pick a conversation on the left.</div>'; return; }

  const when = d => new Date(d).toLocaleString('en-NG',
    { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  pane.innerHTML = `
    <div class="thrhd">
      <div>
        <b>${esc(t.full_name || t.email || 'Customer')}</b>
        <span>${esc(t.email || '')}${t.phone ? ' · ' + esc(t.phone) : ''}</span>
      </div>
      <div class="spacer"></div>
      <button class="btn btn--sm" onclick="copyThread()" title="Copy the whole conversation">Copy all</button>
      <button class="btn btn--sm" onclick="toggleThreadOpen()">
        ${t.status === 'closed' ? 'Reopen' : 'Mark closed'}</button>
    </div>
    <div class="thrbody" id="thrbody">
      ${_tmsgs.map(m => `
        <div class="bub bub--${m.sender_role === 'staff' ? 'us' : 'them'}">
          ${fileHtml(m)}
          ${m.body ? `<div class="bub__b">${esc(m.body).replace(/\n/g, '<br/>')}</div>` : ''}
          <div class="bub__t">
            ${m.sender_role === 'staff' ? 'You · ' : ''}${esc(when(m.created_at))}
            ${m.body ? `<button class="bub__copy" data-copy="${m.id}" title="Copy this message">copy</button>` : ''}
          </div>
        </div>`).join('') || '<div class="empty">No messages yet.</div>'}
    </div>
    <div class="thrpend" id="thrpend" hidden></div>
    <form class="thrform" onsubmit="sendReply(event)">
      <input type="file" id="reply-file" hidden
        accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/heic,application/pdf,video/mp4,video/quicktime,video/webm,video/3gpp"/>
      <button class="btn thrclip" type="button" onclick="pickReplyFile()" title="Attach a file">${SUP_CLIP}</button>
      <textarea class="inp" id="reply" rows="2" maxlength="4000"
        placeholder="Write a reply… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button class="btn btn--primary" type="submit">Send</button>
    </form>`;


function renderThread() {
  const t = _threads.find(x => x.id === _thread);
  const pane = document.getElementById('thread-pane');
  if (!t) { pane.innerHTML = '<div class="empty">Pick a conversation on the left.</div>'; return; }

  const when = d => new Date(d).toLocaleString('en-NG',
    { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  pane.innerHTML = `
    <div class="thrhd">
      <div>
        <b>${esc(t.full_name || t.email || 'Customer')}</b>
        <span>${esc(t.email || '')}${t.phone ? ' · ' + esc(t.phone) : ''}</span>
      </div>
      <div class="spacer"></div>
      <button class="btn btn--sm" onclick="copyThread()" title="Copy the whole conversation">Copy all</button>
      <button class="btn btn--sm" onclick="toggleThreadOpen()">
        ${t.status === 'closed' ? 'Reopen' : 'Mark closed'}</button>
    </div>
    <div class="thrbody" id="thrbody">
      ${_tmsgs.map(m => `
        <div class="bub bub--${m.sender_role === 'staff' ? 'us' : 'them'}">
          ${fileHtml(m)}
          ${m.body ? `<div class="bub__b">${esc(m.body).replace(/\n/g, '<br/>')}</div>` : ''}
          <div class="bub__t">
            ${m.sender_role === 'staff' ? 'You · ' : ''}${esc(when(m.created_at))}
            ${m.body ? `<button class="bub__copy" data-copy="${m.id}" title="Copy this message">copy</button>` : ''}
          </div>
        </div>`).join('') || '<div class="empty">No messages yet.</div>'}
    </div>
    <div class="thrpend" id="thrpend" hidden></div>
    <form class="thrform" onsubmit="sendReply(event)">
      <input type="file" id="reply-file" hidden
        accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/heic,application/pdf,video/mp4,video/quicktime,video/webm,video/3gpp"/>
      <button class="btn thrclip" type="button" onclick="pickReplyFile()" title="Attach a file">${SUP_CLIP}</button>
      <textarea class="inp" id="reply" rows="2" maxlength="4000"
        placeholder="Write a reply… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button class="btn btn--primary" type="submit">Send</button>
    </form>`;

  const body = document.getElementById('thrbody');
  body.scrollTop = body.scrollHeight;

  /* One listener for the whole list rather than one per bubble — the list is
     redrawn on every message, and per-bubble handlers would pile up. */
  body.onclick = e => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    const m = _tmsgs.find(x => String(x.id) === b.dataset.copy);
    if (m) copyText(m.body || '', 'Message copied');
  };


renderThread();

/* what we actually want to know */
const out = [];
out.push('copy buttons on text messages: ' + document.querySelectorAll('[data-copy]').length);
out.push('none on the attachment-only message: ' + !document.querySelector('[data-copy="m3"]'));
out.push('copy-all button present: ' + /Copy all/.test(document.body.innerHTML));

/* capture what copyThread would put on the clipboard */
let captured = '';
navigator.clipboard = { writeText: async (t) => { captured = t; } };
copyThread();
setTimeout(() => {
  out.push('transcript names the customer: ' + captured.includes('Amaka Obi'));
  out.push('transcript names the shop: ' + captured.includes('Rex-Giddoty'));
  out.push('attachment noted: ' + captured.includes('(attachment)'));
  out.push('line count: ' + captured.split('\n').filter(Boolean).length);
  document.title = out.join(' | ');
}, 50);
</script></body></html>
