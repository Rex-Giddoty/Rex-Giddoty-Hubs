<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="shell shell--full">
  <div id="state"></div>

  <main class="pdp" id="pdp" style="display:none;">
    <div class="box pdp__main">
      <div>
        <div class="gal__big" id="gal-big"></div>
        <div class="gal__thumbs" id="gal-thumbs"></div>
      </div>
      <div>
        <div class="note" id="p-brand"></div>
        <h1 id="p-name" style="font-size:19px;font-weight:500;line-height:1.35;margin:2px 0 6px;"></h1>
        <div class="stars" id="p-stars" style="margin-bottom:10px;"></div>

        <div>
          <span class="price-now" id="p-price"></span>
          <span class="price-was" id="p-was" style="display:none;"></span>
          <span class="off-tag" id="p-off" style="display:none;"></span>
        </div>
        <div class="note" id="p-stock" style="margin-top:6px;"></div>

        <div id="col-wrap" style="display:none;margin-top:14px;">
          <div style="font-size:13px;font-weight:600;">Colour</div>
          <div class="swatches" id="cols"></div>
        </div>

        <div id="opt-wrap" style="display:none;margin-top:14px;">
          <div class="optrow">
            <div style="font-size:13px;font-weight:600;" id="opt-label">Size</div>
            <button class="guidelink" id="guide-open" style="display:none;"
              onclick="document.getElementById('guide-modal').classList.add('on')">Size guide</button>
          </div>
          <div class="opt" id="opts"></div>
        </div>

        <div style="display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap;">
          <div class="qty">
            <button onclick="bump(-1)">−</button><span id="qty">1</span><button onclick="bump(1)">+</button>
          </div>
          <button class="btn" id="add" style="flex:1;min-width:180px;">Add to cart</button>
        </div>

        <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:5px;">Delivery &amp; payment</div>
          <div class="note" id="p-delivery" style="white-space:pre-wrap;"></div>
        </div>
      </div>
    </div>

    <aside>
      <div class="box" style="padding:13px;">
        <div style="font-weight:600;margin-bottom:9px;">Product details</div>
        <div class="note" id="p-desc" style="white-space:pre-wrap;"></div>
      </div>
      <div class="box" style="padding:13px;margin-top:12px;" id="details-box">
        <div style="font-weight:600;margin-bottom:9px;">Specifications</div>
        <div class="note" id="p-details" style="white-space:pre-wrap;"></div>
      </div>
    </aside>
  </main>

  <section class="sect" id="more-sect" style="display:none;">
    <div class="sect__hd sect__hd--plain"><h2>You may also like</h2><a href="/shop.html">See all ›</a></div>
    <div class="pgrid" id="more"></div>
  </section>
</div>

<div class="gmodal" id="guide-modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="gmodal__card">
    <div class="gmodal__h">
      <b id="guide-title">Size guide</b>
      <button onclick="document.getElementById('guide-modal').classList.remove('on')" aria-label="Close">✕</button>
    </div>
    <div id="guide-body"></div>
  </div>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, M = window.RG_MONEY, esc = window.RG_ESC, IMG = window.RG_IMG;

/* The same palette the ops editor offers, so a colour tapped there shows the
   same dot here. Anything typed by hand gets a neutral one rather than nothing. */
const SWATCH = {
  black:'#1b1b1b', white:'#ffffff', 'off-white':'#f2ece1', grey:'#8b8b90', gray:'#8b8b90',
  brown:'#6b4423', tan:'#c19a6b', sand:'#dfcfb0', red:'#c62828', wine:'#6d1b2e',
  pink:'#e59bb7', orange:'#e07b25', yellow:'#e3b829', green:'#2f7d46', blue:'#1f4e9c',
  navy:'#1b2a4a', purple:'#9030d0', gold:'#c9a227', silver:'#c0c4c9',
  multicolour:'linear-gradient(135deg,#c62828,#e3b829,#2f7d46,#1f4e9c)',
};
const swatchFor = c => SWATCH[String(c || '').trim().toLowerCase()]
  || 'linear-gradient(135deg,#c9c9c9,#9a9a9a)';

/* The specifications block still names the colours, read off the variants
   rather than a field of their own — one source of truth. */
function colourSpec(p) {
  const names = [...new Set((p.product_variants || [])
    .filter(v => v.is_active && v.color).map(v => v.color))];
  return names.length ? 'Colour: ' + names.join(', ') : '';
}

/* A guide is either a chart somebody drew or measurements somebody typed.
   A typed one gets a cm/inch switch, because a shopper with a tape measure has
   whichever one they have and should not be doing the arithmetic. */
const CM_PER_IN = 2.54;
let _guide = null, _gunits = null;

/* Converts every number it finds and leaves the rest alone, so "86–92" and
   "8.5" and "2–3y" all survive. The size column is a name, never a
   measurement, so it is not touched. */
function convertRow(row, from, to) {
  if (from === to) return row;
  const f = n => to === 'in' ? (n / CM_PER_IN).toFixed(1).replace(/\.0$/, '')
                             : String(Math.round(n * CM_PER_IN));
  return row.map((cell, i) => i === 0 ? cell
    : String(cell).replace(/\d+(\.\d+)?/g, m => f(parseFloat(m))));
}

function paintGuide(guide, name) {
  const body = document.getElementById('guide-body');
  document.getElementById('guide-title').textContent = 'Size guide — ' + name;
  _guide = guide;

  if (guide.kind === 'image' && guide.image_path) {
    body.innerHTML = `<img class="gchart" src="${esc(IMG(guide.image_path))}" alt="Size guide"/>`
      + (guide.note ? `<p class="gnote">${esc(guide.note)}</p>` : '');
    document.getElementById('guide-open').style.display = '';
    return placeGuideLink();
  }
  if (!(guide.kind === 'table' && (guide.rows || []).length)) return;

  _gunits = guide.units || 'cm';
  drawGuideTable();
  document.getElementById('guide-open').style.display = '';
  placeGuideLink();
}

function drawGuideTable() {
  const g = _guide;
  const rows = g.rows.map(r => convertRow(r, g.units || 'cm', _gunits));
  const unit = ' (' + _gunits + ')';
  const btn = u => `<button class="gunit ${_gunits === u ? 'on' : ''}"
    onclick="setGuideUnit('${u}')">${u === 'cm' ? 'cm' : 'inches'}</button>`;

  document.getElementById('guide-body').innerHTML =
      `<div class="gunits">${btn('cm')}${btn('in')}</div>`
    + '<div class="gscroll"><table class="gtable"><thead><tr><th>Size</th>'
    + (g.columns || []).map(c => '<th>' + esc(c) + unit + '</th>').join('')
    + '</tr></thead><tbody>'
    + rows.map(r => '<tr>' + r.map((cell, i) =>
        i === 0 ? '<th>' + esc(cell) + '</th>' : '<td>' + esc(cell || '—') + '</td>').join('') + '</tr>').join('')
    + '</tbody></table></div>'
    + (g.note ? '<p class="gnote">' + esc(g.note) + '</p>' : '');
}

/* Always converted from what was stored, never from what is on screen, so
   switching back and forth cannot drift the numbers. */
function setGuideUnit(u) { _gunits = u; drawGuideTable(); }

function placeGuideLink() {
  const link = document.getElementById('guide-open');
  /* The link lives beside the size row, which hides itself for a one-size item
     — so a guide on such an item gets its own place to be opened from. */
  if (document.getElementById('opt-wrap').style.display === 'none') {
    document.getElementById('col-wrap').insertAdjacentElement('afterend', link);
    link.classList.add('guidelink--solo');
  }
}const slug = new URLSearchParams(location.search).get('slug');
let _p = null, _v = null, _qty = 1;

(async () => {
  await window.RG_CHROME();
  const s = await window.RG_SETTINGS();
  if (!slug) return notFound();

  const { data: p } = await db.from('products')
    .select('id,slug,name,subtitle,description,details,material,brand,badge,price_minor,compare_at_minor,currency,rating_avg,rating_count,status,size_guide,product_images(path,position,color),product_variants(id,color,option_name,option_value,price_minor,stock,is_active,position),product_categories(categories(name,slug,size_guide))')
    .eq('slug', slug).eq('status','published').maybeSingle();
  if (!p) return notFound();

  _p = p;
  document.title = p.name + ' — Rex-Giddoty Hubs';
  window.RG_SEO(document.title);   /* title is only known once the product loads */
  document.getElementById('pdp').style.display = '';

  /* Media is photographs and, sometimes, a short clip. Whichever comes first in
     position order opens the gallery, but a video never opens muted-and-playing
     — it waits for the shopper to press it. */
  const isVid = window.RG_IS_VIDEO;
  const media = (p.product_images || []).sort((a,b)=>a.position-b.position);
  const big = document.getElementById('gal-big');
  let _shown = media;

  /* #t=0.1 makes the browser seek a hundredth of the way in and paint that
     frame. Without it a video waiting to be played is a black rectangle. */
  const showBig = m => {
    big.innerHTML = isVid(m.path)
      ? `<video id="big-img" src="${esc(IMG(m.path))}#t=0.1" controls playsinline preload="metadata"></video>`
      : `<img id="big-img" src="${esc(IMG(m.path))}" alt="${esc(p.name)}"/>`;
  };

  const cat = (p.product_categories || [])[0]?.categories;
  document.getElementById('p-brand').textContent = p.brand || (cat ? cat.name : '');
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-desc').textContent = p.description || p.subtitle || 'No description provided.';
  /* Material leads the specifications — it is the thing shoppers check first. */
  const dbox = document.getElementById('details-box');
  const spec = [
    p.material ? 'Material: ' + p.material : '',
    colourSpec(p),
    p.details || '',
  ].filter(Boolean).join('\n\n');
  if (spec) document.getElementById('p-details').textContent = spec;
  else dbox.style.display = 'none';

  if (p.rating_avg) {
    const full = Math.round(Number(p.rating_avg));
    document.getElementById('p-stars').innerHTML =
      `<i>${'★'.repeat(full)}${'☆'.repeat(5-full)}</i> ${Number(p.rating_avg).toFixed(1)} (${p.rating_count||0} reviews)`;
  }

  const flat = parseInt(s.shipping_flat_minor || '0', 10);
  const free = parseInt(s.free_shipping_over_minor || '0', 10);
  document.getElementById('p-delivery').textContent =
    (flat ? `Delivery ${M.fmt(flat, p.currency)}` : 'Delivery calculated at checkout') +
    (free ? `, free on orders over ${M.fmt(free, p.currency)}.` : '.') +
    '\n\n' + (s.payment_instructions || 'Payment is confirmed before dispatch.');

  /* ── colour and size ──
   * A variant is a (colour, size) pair. The colour picks the photographs and
   * narrows the sizes; the size picks the variant that goes in the cart.
   * A colour of null is "Default" — the item that does not come in colours, and
   * the only option for everything that predates this. */
  const vs = (p.product_variants || []).filter(v => v.is_active).sort((a,b)=>a.position-b.position);

  const colours = [];
  for (const v of vs) {
    const c = v.color || '';
    if (!colours.some(x => x === c)) colours.push(c);
  }
  /* Only worth showing when there is a choice to make. An item that is Default
     and nothing else looks exactly as it did before colours existed. */
  const hasColours = colours.filter(c => c !== '').length > 0;
  let _colour = hasColours
    ? (colours.find(c => vs.some(v => (v.color || '') === c && v.stock > 0)) ?? colours[0])
    : '';

  const sizesFor = c => vs.filter(v => (v.color || '') === c);

  function paintColours() {
    const wrap = document.getElementById('col-wrap');
    if (!hasColours) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    document.getElementById('cols').innerHTML = colours.map(c => {
      const left = sizesFor(c).reduce((n, v) => n + (v.stock || 0), 0);
      const label = c === '' ? 'Default' : c;
      return `<button class="swatchbtn ${c === _colour ? 'on' : ''}" data-c="${esc(c)}"
        ${left <= 0 ? 'disabled' : ''} aria-pressed="${c === _colour}" title="${esc(label)}">
        <i style="background:${swatchFor(c)}"></i>${esc(label)}</button>`;
    }).join('');
    document.querySelectorAll('#cols button').forEach(b => b.onclick = () => {
      _colour = b.dataset.c;
      paintColours(); paintSizes(); paintGallery();
    });
  }

  function paintSizes() {
    const mine = sizesFor(_colour);
    /* "One Size" on its own is not a choice, so it is not offered as one. */
    const meaningful = mine.length > 1
      || (mine[0] && String(mine[0].option_value).toLowerCase() !== 'one size');
    const wrap = document.getElementById('opt-wrap');
    wrap.style.display = meaningful ? '' : 'none';

    if (meaningful) {
      document.getElementById('opt-label').textContent = mine[0]?.option_name || 'Size';
      document.getElementById('opts').innerHTML = mine.map(v =>
        `<button data-v="${v.id}" ${v.stock <= 0 ? 'disabled' : ''} aria-pressed="false">${esc(v.option_value)}</button>`).join('');
      document.querySelectorAll('#opts button').forEach(b => b.onclick = () => {
        document.querySelectorAll('#opts button').forEach(x => x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        pick(mine.find(v => v.id === b.dataset.v));
      });
    }
    const inStock = mine.find(v => v.stock > 0);
    pick(inStock || mine[0] || null);
    if (inStock && meaningful) {
      const b = document.querySelector(`#opts button[data-v="${inStock.id}"]`);
      if (b) b.setAttribute('aria-pressed','true');
    }
  }

  /* Photographs of the chosen colour, plus the item's general photography.
     A colour with no pictures of its own therefore still shows something. */
  function mediaFor(c) {
    const own = media.filter(m => (m.color || '') === c && c !== '');
    const general = media.filter(m => !(m.color || ''));
    return own.length ? own.concat(general) : (general.length ? general : media);
  }

  function paintGallery() {
    const list = hasColours ? mediaFor(_colour) : media;
    _shown = list;
    if (list.length) showBig(list[0]);
    else big.innerHTML = '<div class="skeleton" style="width:100%;height:100%;"></div>';

    document.getElementById('gal-thumbs').innerHTML = list.length > 1
      ? list.map((m,i) => isVid(m.path)
          ? `<span class="gal__vid ${i?'':'on'}" data-i="${i}">
               <video src="${esc(IMG(m.path))}#t=0.1" muted preload="metadata"></video>
               <b>▶</b></span>`
          : `<img src="${esc(IMG(m.path))}" class="${i?'':'on'}" data-i="${i}" alt=""/>`).join('')
      : '';

    document.querySelectorAll('.gal__thumbs [data-i]').forEach(t => t.onclick = () => {
      showBig(_shown[Number(t.dataset.i)]);
      document.querySelectorAll('.gal__thumbs [data-i]').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
    });
  }

  paintColours(); paintSizes(); paintGallery();

  /* ── size guide ── */
  const guide = p.size_guide || (p.product_categories || [])
    .map(pc => pc.categories && pc.categories.size_guide).find(Boolean);
  if (guide) paintGuide(guide, p.name);

  const { data: more } = await db.from('products')
    .select('id,slug,name,price_minor,compare_at_minor,currency,badge,rating_avg,rating_count,product_images(path,position),product_variants(id,stock,price_minor)')
    .eq('status','published').neq('id', p.id).limit(12);
  if (more && more.length) {
    document.getElementById('more-sect').style.display = '';
    document.getElementById('more').innerHTML = more.map(window.RG_CARD).join('');
  }
})();

function pick(v) {
  _v = v; _qty = 1; document.getElementById('qty').textContent = '1';
  const price = v && v.price_minor != null ? v.price_minor : _p.price_minor;
  document.getElementById('p-price').textContent = M.fmt(price, _p.currency);

  const was = document.getElementById('p-was'), offEl = document.getElementById('p-off');
  if (_p.compare_at_minor && _p.compare_at_minor > price) {
    was.textContent = M.fmt(_p.compare_at_minor, _p.currency); was.style.display = '';
    offEl.textContent = '-' + Math.round((1 - price/_p.compare_at_minor)*100) + '%'; offEl.style.display = '';
  } else { was.style.display = 'none'; offEl.style.display = 'none'; }

  const add = document.getElementById('add'), note = document.getElementById('p-stock');
  if (!v || v.stock <= 0) {
    add.disabled = true; add.textContent = v ? 'Out of stock' : 'Unavailable';
    note.textContent = v ? 'This option is out of stock.' : '';
  } else {
    add.disabled = false; add.textContent = 'Add to cart';
    note.textContent = v.stock <= 5 ? `Only ${v.stock} left in stock` : 'In stock';
  }
}

function bump(d) {
  if (!_v) return;
  /* never let the counter promise more than the shelf holds */
  _qty = Math.max(1, Math.min(20, Math.min(_v.stock || 1, _qty + d)));
  document.getElementById('qty').textContent = _qty;
}

document.getElementById('add').onclick = () => {
  if (!_v || _v.stock <= 0) return;
  window.RG_BAG.add(_v.id, _qty);
  window.RG_TOAST(_qty + ' added to cart');
};

function notFound() {
  document.getElementById('state').innerHTML = `<div class="box empty">
    <h2 style="font-size:18px;">Product not found</h2>
    <p>It may have been removed or is not published.</p>
    <a class="btn" href="/shop.html">Continue shopping</a></div>`;
}
</script>
</body>
</html>
