<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="shell shell--full">
  <div id="state"></div>

  <main class="pdp" id="pdp" style="display:none;">
    <div class="box pdp__main">
      <div>
        <div class="gal__big" id="gal-big"></div>
        <div class="gal__thumbs" id="gal-thumbs"></div>
      </div>
      <div>
        <div class="note" id="p-brand"></div>
        <h1 id="p-name" style="font-size:19px;font-weight:500;line-height:1.35;margin:2px 0 6px;"></h1>
        <div class="stars" id="p-stars" style="margin-bottom:10px;"></div>

        <div>
          <span class="price-now" id="p-price"></span>
          <span class="price-was" id="p-was" style="display:none;"></span>
          <span class="off-tag" id="p-off" style="display:none;"></span>
        </div>
        <div class="note" id="p-stock" style="margin-top:6px;"></div>

        <div id="col-wrap" style="display:none;margin-top:14px;">
          <div style="font-size:13px;font-weight:600;">Colour</div>
          <div class="swatches" id="cols"></div>
        </div>

        <div id="opt-wrap" style="display:none;margin-top:14px;">
          <div class="optrow">
            <div style="font-size:13px;font-weight:600;" id="opt-label">Size</div>
            <button class="guidelink" id="guide-open" style="display:none;"
              onclick="document.getElementById('guide-modal').classList.add('on')">Size guide</button>
          </div>
          <div class="opt" id="opts"></div>
          <div class="sizefacts" id="sizefacts"></div>
        </div>

        <div style="display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap;">
          <div class="qty">
            <button onclick="bump(-1)">−</button><span id="qty">1</span><button onclick="bump(1)">+</button>
          </div>
          <button class="btn" id="add" style="flex:1;min-width:180px;">Add to cart</button>
        </div>

        <div class="sold" id="p-sold"></div>

        <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:5px;">Delivery &amp; payment</div>
          <div class="note" id="p-delivery" style="white-space:pre-wrap;"></div>
        </div>
      </div>
    </div>

    <aside>
      <div class="box" style="padding:13px;">
        <div style="font-weight:600;margin-bottom:9px;">Product details</div>
        <div class="note" id="p-desc" style="white-space:pre-wrap;"></div>
      </div>
      <div class="box" style="padding:13px;margin-top:12px;" id="details-box">
        <div style="font-weight:600;margin-bottom:9px;">Specifications</div>
        <div class="note" id="p-details" style="white-space:pre-wrap;"></div>
      </div>
    </aside>
  </main>

  <section class="sect" id="rev-sect">
    <div class="sect__hd sect__hd--plain"><h2>Reviews</h2><div id="rev-head"></div></div>
    <div class="revbox">
      <div id="rev-form"></div>
      <div id="rev-list"></div>
    </div>
  </section>

  <section class="sect" id="more-sect" style="display:none;">
    <div class="sect__hd sect__hd--plain"><h2>You may also like</h2><a href="/shop.html">See all ›</a></div>
    <div class="pgrid" id="more"></div>
  </section>
</div>

<div class="gmodal" id="guide-modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="gmodal__card">
    <div class="gmodal__h">
      <b id="guide-title">Size guide</b>
      <button onclick="document.getElementById('guide-modal').classList.remove('on')" aria-label="Close">✕</button>
    </div>
    <div id="guide-body"></div>
  </div>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, M = window.RG_MONEY, esc = window.RG_ESC, IMG = window.RG_IMG;

/* The same palette the ops editor offers, so a colour tapped there shows the
   same dot here. Anything typed by hand gets a neutral one rather than nothing. */
const SWATCH = {
  black:'#1b1b1b', white:'#ffffff', 'off-white':'#f2ece1', grey:'#8b8b90', gray:'#8b8b90',
  brown:'#6b4423', tan:'#c19a6b', sand:'#dfcfb0', red:'#c62828', wine:'#6d1b2e',
  pink:'#e59bb7', orange:'#e07b25', yellow:'#e3b829', green:'#2f7d46', blue:'#1f4e9c',
  navy:'#1b2a4a', purple:'#9030d0', gold:'#c9a227', silver:'#c0c4c9',
  multicolour:'linear-gradient(135deg,#c62828,#e3b829,#2f7d46,#1f4e9c)',
};
const swatchFor = c => SWATCH[String(c || '').trim().toLowerCase()]
  || 'linear-gradient(135deg,#c9c9c9,#9a9a9a)';

/* The specifications block still names the colours, read off the variants
   rather than a field of their own — one source of truth. */
function colourSpec(p) {
  const names = [...new Set((p.product_variants || [])
    .filter(v => v.is_active && v.color).map(v => v.color))];
  return names.length ? 'Colour: ' + names.join(', ') : '';
}

/* ── reviews ──
 * Read by anyone, written only by someone with an order line for the item.
 * The rule lives in the database; this page asks whether it applies so it can
 * show the right thing, and never depends on the answer for safety.
 */
let _canReview = false, _myReview = null;

const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const reviewWhen = t => new Date(t).toLocaleDateString('en-NG',
  { day: 'numeric', month: 'short', year: 'numeric' });

async function loadReviews() {
  const { data } = await db.rpc('product_reviews_public', { p_product: _p.id });
  const list = data || [];
  _myReview = list.find(r => r.mine) || null;

  const box = document.getElementById('rev-list');
  const head = document.getElementById('rev-head');

  if (!list.length) {
    head.textContent = 'No reviews yet';
    box.innerHTML = '<p class="rev-none">Be the first to say how it turned out.</p>';
  } else {
    const avg = list.reduce((s, r) => s + r.rating, 0) / list.length;
    head.innerHTML = `<b>${avg.toFixed(1)}</b> <i class="rev-stars">${stars(Math.round(avg))}</i>
      <span>${list.length} review${list.length === 1 ? '' : 's'}</span>`;
    box.innerHTML = list.map(r => `
      <div class="rev ${r.mine ? 'rev--mine' : ''}">
        <div class="rev__top">
          <i class="rev-stars">${stars(r.rating)}</i>
          <b>${esc(r.author)}</b>
          ${r.verified ? '<span class="rev__ok">Verified purchase</span>' : ''}
          ${r.mine ? '<span class="rev__mine">Yours</span>' : ''}
          <span class="rev__date">${esc(reviewWhen(r.created_at))}</span>
        </div>
        ${r.body ? `<p>${esc(r.body).replace(/\n/g, '<br/>')}</p>` : ''}
      </div>`).join('');
  }

  paintReviewForm();
}

/* Four states, and each says plainly why it is the one being shown: write one,
   edit the one you left, sign in, or buy it first. */
async function paintReviewForm() {
  const box = document.getElementById('rev-form');
  let session = null;
  try { ({ data: { session } } = await db.auth.getSession()); } catch (_) {}
  const signedIn = !!(session && session.user && !session.user.is_anonymous);

  if (!signedIn) {
    box.innerHTML = `<p class="rev-note">
      <a href="/login.html?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>
      to leave a review for something you have bought.</p>`;
    return;
  }

  if (!_canReview) {
    const { data } = await db.rpc('can_review', { p_product: _p.id });
    _canReview = !!data;
  }
  if (!_canReview) {
    box.innerHTML = '<p class="rev-note">Reviews come from people who have bought the item, so there is nothing to write here yet.</p>';
    return;
  }

  const r = _myReview;
  box.innerHTML = `
    <div class="revform">
      <div class="revform__t">${r ? 'Your review' : 'Write a review'}</div>
      <div class="revform__stars" id="rev-pick">
        ${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}"
          class="${r && r.rating >= n ? 'on' : ''}" aria-label="${n} star${n===1?'':'s'}">★</button>`).join('')}
      </div>
      <textarea id="rev-body" rows="3" maxlength="2000"
        placeholder="How did it turn out? Fit, quality, delivery — whatever would have helped you.">${r ? esc(r.body || '') : ''}</textarea>
      <div id="rev-msg"></div>
      <div class="revform__row">
        <button class="btn" id="rev-send">${r ? 'Update review' : 'Post review'}</button>
        ${r ? '<button class="revform__del" id="rev-del">Delete</button>' : ''}
      </div>
    </div>`;

  let picked = r ? r.rating : 0;
  const paintStars = () => document.querySelectorAll('#rev-pick button')
    .forEach(b => b.classList.toggle('on', Number(b.dataset.n) <= picked));
  document.querySelectorAll('#rev-pick button').forEach(b => {
    b.onclick = () => { picked = Number(b.dataset.n); paintStars(); };
  });

  document.getElementById('rev-send').onclick = async () => {
    const msg = document.getElementById('rev-msg');
    if (!picked) { msg.innerHTML = '<div class="rev-err">Choose a rating first.</div>'; return; }
    const btn = document.getElementById('rev-send');
    btn.disabled = true;
    const { error } = await db.rpc('submit_review', {
      p_product: _p.id, p_rating: picked,
      p_body: document.getElementById('rev-body').value,
    });
    btn.disabled = false;
    if (error) { msg.innerHTML = `<div class="rev-err">${esc(error.message)}</div>`; return; }
    window.RG_TOAST('Thank you — your review is up');
    await loadReviews();
    await refreshStars();
  };

  const del = document.getElementById('rev-del');
  if (del) del.onclick = async () => {
    if (!confirm('Delete your review?')) return;
    const { error } = await db.rpc('delete_my_review', { p_product: _p.id });
    if (error) return window.RG_TOAST(error.message);
    _myReview = null;
    await loadReviews();
    await refreshStars();
  };
}

/* The stars at the top are the same figure the reviews add up to, so they are
   re-read rather than recalculated here. */
async function refreshStars() {
  const { data } = await db.from('products')
    .select('rating_avg,rating_count').eq('id', _p.id).maybeSingle();
  if (!data) return;
  _p.rating_avg = data.rating_avg;
  _p.rating_count = data.rating_count;
  const el = document.getElementById('p-stars');
  el.innerHTML = data.rating_avg
    ? `<i>${stars(Math.round(Number(data.rating_avg)))}</i> ${Number(data.rating_avg).toFixed(1)} (${data.rating_count || 0} review${data.rating_count === 1 ? '' : 's'})`
    : '';
}

/* ── the size guide a shopper sees ──
 * Two tables where the shop has set them — what the garment measures, and what
 * body it suits — a cm/inch switch, and, when the body table names heights and
 * weights, a box that picks the size for you.
 *
 * The recommendation is nothing cleverer than matching your numbers against
 * the shop's own ranges. No model of how bodies are built is involved, which
 * is why it only appears when those ranges exist.
 */
const CM_PER_IN = 2.54, KG_PER_LB = 0.45359237;
let _guide = null, _gunits = null;

const guideTables = g => Array.isArray(g?.tables) && g.tables.length
  ? g.tables
  : (Array.isArray(g?.rows) && g.rows.length
      ? [{ title: 'Measurements', columns: g.columns || [], rows: g.rows }]
      : []);

const isWeightCol = name => /weight|kg|lb/i.test(String(name || ''));

/* Converts every number it finds and leaves the rest alone, so "86–92" and
   "8.5" and "2–3y" all survive. The size column is a name, not a measurement. */
function convertTable(t, from, to) {
  if (from === to) return t;
  const f = (n, weight) => {
    if (weight) return to === 'in' ? String(Math.round(n / KG_PER_LB)) : String(Math.round(n * KG_PER_LB));
    return to === 'in' ? (n / CM_PER_IN).toFixed(1).replace(/\.0$/, '') : String(Math.round(n * CM_PER_IN));
  };
  return { ...t, rows: t.rows.map(r => r.map((cell, ci) => ci === 0 ? cell
    : String(cell).replace(/\d+(\.\d+)?/g, m => f(parseFloat(m), isWeightCol(t.columns[ci - 1]))))) };
}

/* ── the measurements for the size in hand ──
 * Picking L and being told what L measures, without opening anything: the
 * numbers come from whichever guide the item shows, so there is one source and
 * the panel cannot disagree with the line above it.
 *
 * The unit follows whatever the shopper last chose and is remembered, because
 * somebody who thinks in inches thinks in inches on every product.
 */
const UNIT_KEY = 'rg_units';
function readUnitPref() {
  try { const u = localStorage.getItem(UNIT_KEY); return u === 'in' || u === 'cm' ? u : null; } catch (_) { return null; }
}
function writeUnitPref(u) { try { localStorage.setItem(UNIT_KEY, u); } catch (_) {} }

/* The body table first — a shopper matching themselves to a size wants their
   own measurements, not the garment's. */
function factsTable() {
  const tables = guideTables(_guide);
  return tables.find(t => colIndex(t, /height/i) >= 0 || colIndex(t, /weight/i) >= 0) || tables[0];
}

function paintSizeFacts(sizeName) {
  const box = document.getElementById('sizefacts');
  if (!box) return;
  const t = _guide ? factsTable() : null;
  const row = t && (t.rows || []).find(r =>
    String(r[0]).trim().toLowerCase() === String(sizeName || '').trim().toLowerCase());
  if (!row) { box.innerHTML = ''; return; }

  const shown = convertTable(t, _guide.units || 'cm', _gunits);
  const line = shown.rows.find(r => r[0] === row[0]) || row;
  const lenU = _gunits === 'in' ? 'in' : 'cm', wgtU = _gunits === 'in' ? 'lb' : 'kg';

  const parts = (t.columns || []).map((c, i) => {
    const v = String(line[i + 1] || '').trim();
    if (!v) return '';
    return `<span><i>${esc(c)}</i> ${esc(v)} ${isWeightCol(c) ? wgtU : lenU}</span>`;
  }).filter(Boolean);
  if (!parts.length) { box.innerHTML = ''; return; }

  box.innerHTML = `<div class="sizefacts__row">${parts.join('')}</div>
    <div class="sizefacts__foot">
      <button onclick="flipUnits()">${_gunits === 'in' ? 'Show cm' : 'Show inches'}</button>
      <button onclick="document.getElementById('guide-modal').classList.add('on')">Full size guide</button>
    </div>`;
}

/* One switch for both places, so the line and the panel never disagree. */
function flipUnits() {
  _gunits = _gunits === 'in' ? 'cm' : 'in';
  writeUnitPref(_gunits);
  if (_guide) { drawGuide(); paintSizeFacts(_lastSize); }
}

function paintGuide(guide, name) {
  document.getElementById('guide-title').textContent = 'Size guide — ' + name;
  _guide = guide;

  if (guide.kind === 'image' && guide.image_path) {
    document.getElementById('guide-body').innerHTML =
      `<img class="gchart" src="${esc(IMG(guide.image_path))}" alt="Size guide"/>`
      + (guide.note ? `<p class="gnote">${esc(guide.note)}</p>` : '');
  } else if (guideTables(guide).length) {
    _gunits = readUnitPref() || guide.units || 'cm';
    drawGuide();
  } else {
    return;                              // nothing usable, so no link is offered
  }
  document.getElementById('guide-open').style.display = '';
  placeGuideLink();
}

/* Always rebuilt from what was stored, never from what is on screen, so
   switching units back and forth cannot drift the numbers. */
function drawGuide() {
  const g = _guide;
  const base = g.units || 'cm';
  const tables = guideTables(g).map(t => convertTable(t, base, _gunits));
  const lenU = _gunits, wgtU = _gunits === 'in' ? 'lb' : 'kg';
  const btn = u => `<button class="gunit ${_gunits === u ? 'on' : ''}"
    onclick="setGuideUnit('${u}')">${u === 'cm' ? 'cm / kg' : 'inches / lb'}</button>`;

  document.getElementById('guide-body').innerHTML =
      `<div class="gunits">${btn('cm')}${btn('in')}</div>`
    + recommenderHtml(tables)
    + tables.map(t => `
        <div class="gtwrap">
          <div class="gttitle">${esc(t.title || 'Measurements')}</div>
          <div class="gscroll"><table class="gtable">
            <thead><tr><th>Size</th>${(t.columns || []).map(c =>
              `<th>${esc(c)} <i>(${isWeightCol(c) ? wgtU : lenU})</i></th>`).join('')}</tr></thead>
            <tbody>${t.rows.map(r => `<tr data-size="${esc(r[0])}">${r.map((cell, i) =>
              i === 0 ? `<th>${esc(cell)}</th>` : `<td>${esc(cell || '—')}</td>`).join('')}</tr>`).join('')}
            </tbody></table></div>
        </div>`).join('')
    + (g.note ? `<p class="gnote">${esc(g.note)}</p>` : '');
}

function setGuideUnit(u) {
  _gunits = u;
  writeUnitPref(u);
  drawGuide();
  paintSizeFacts(_lastSize);
}

/* ── find my size ── */
const colIndex = (t, re) => (t.columns || []).findIndex(c => re.test(String(c)));

function recommenderHtml(tables) {
  const t = tables.find(x => colIndex(x, /height/i) >= 0 && colIndex(x, /weight/i) >= 0);
  if (!t) return '';
  const lenU = _gunits === 'in' ? 'in' : 'cm', wgtU = _gunits === 'in' ? 'lb' : 'kg';
  return `<div class="grec">
      <b>Find my size</b>
      <div class="grec__row">
        <label>Height <span>(${lenU})</span><input id="rec-h" inputmode="decimal" oninput="recommend()"/></label>
        <label>Weight <span>(${wgtU})</span><input id="rec-w" inputmode="decimal" oninput="recommend()"/></label>
      </div>
      <div class="grec__out" id="rec-out">Enter both and we will point at a row below.</div>
    </div>`;
}

/* A range is written "160–168"; a single number means that size and no other.
   Anything unparseable simply does not match, which is the safe way to fail. */
function readRange(cell) {
  const nums = String(cell).match(/\d+(\.\d+)?/g);
  if (!nums || !nums.length) return null;
  const lo = parseFloat(nums[0]);
  return { lo, hi: nums.length > 1 ? parseFloat(nums[1]) : lo };
}

/* How far outside a range a number falls, measured in range-widths so height in
   centimetres and weight in kilogrammes can be compared to each other. Inside
   the range is nothing at all. */
function miss(cell, value) {
  const r = readRange(cell);
  if (!r) return Infinity;
  if (value >= r.lo - 0.001 && value <= r.hi + 0.001) return 0;
  const span = Math.max(r.hi - r.lo, 1);
  return (value < r.lo ? r.lo - value : value - r.hi) / span;
}

function recommend() {
  const out = document.getElementById('rec-out');
  const h = parseFloat((document.getElementById('rec-h') || {}).value);
  const w = parseFloat((document.getElementById('rec-w') || {}).value);
  document.querySelectorAll('.gtable tr.hit').forEach(r => r.classList.remove('hit'));
  if (!(h > 0) || !(w > 0)) {
    out.textContent = 'Enter both and we will point at a row below.';
    out.className = 'grec__out';
    return;
  }

  const tables = guideTables(_guide).map(t => convertTable(t, _guide.units || 'cm', _gunits));
  const t = tables.find(x => colIndex(x, /height/i) >= 0 && colIndex(x, /weight/i) >= 0);
  const hi = colIndex(t, /height/i) + 1, wi = colIndex(t, /weight/i) + 1;

  /* One score per row rather than a list of anything that half-matched: a
     shopper asking which size to buy wants an answer, not five. */
  const scored = t.rows
    .map(r => ({ name: r[0], score: miss(r[hi], h) + miss(r[wi], w) }))
    .filter(x => Number.isFinite(x.score))
    .sort((a, b) => a.score - b.score);

  if (!scored.length || scored[0].score > 2) {
    out.textContent = 'Nothing here is close to those measurements — message us and we will check for you.';
    out.className = 'grec__out grec__out--miss';
    return;
  }

  const best = scored[0].score;
  const names = [...new Set(scored.filter(x => x.score === best).map(x => x.name))];
  out.innerHTML = best === 0
    ? `Try <b>${esc(names.join(' or '))}</b>.`
    : `Closest is <b>${esc(names.join(' or '))}</b> — you are between sizes, so size up if you like a looser fit.`;
  out.className = 'grec__out grec__out--hit';

  /* The suggestion points at the table rather than replacing it: seeing why is
     worth more than being told. */
  names.forEach(n => document.querySelectorAll(`.gtable tr[data-size="${CSS.escape(n)}"]`)
    .forEach(r => r.classList.add('hit')));
}

function placeGuideLink() {
  const link = document.getElementById('guide-open');
  /* The link lives beside the size row, which hides itself for a one-size item
     — so a guide on such an item gets its own place to be opened from. */
  if (document.getElementById('opt-wrap').style.display === 'none') {
    document.getElementById('col-wrap').insertAdjacentElement('afterend', link);
    link.classList.add('guidelink--solo');
  }
}const slug = new URLSearchParams(location.search).get('slug');
let _p = null, _v = null, _qty = 1, _lastSize = null;

(async () => {
  await window.RG_CHROME();
  const s = await window.RG_SETTINGS();
  if (!slug) return notFound();

  const { data: p } = await db.from('products')
    .select('id,slug,name,subtitle,description,details,material,brand,badge,sold_count,price_minor,compare_at_minor,currency,rating_avg,rating_count,status,size_guide,product_images(path,position,color),product_variants(id,color,option_name,option_value,price_minor,stock,is_active,position),product_categories(categories(name,slug,size_guide))')
    .eq('slug', slug).eq('status','published').maybeSingle();
  if (!p) return notFound();

  _p = p;
  document.title = p.name + ' — Rex-Giddoty Hubs';
  window.RG_SEO(document.title);   /* title is only known once the product loads */
  document.getElementById('pdp').style.display = '';

  /* Media is photographs and, sometimes, a short clip. Whichever comes first in
     position order opens the gallery, but a video never opens muted-and-playing
     — it waits for the shopper to press it. */
  const isVid = window.RG_IS_VIDEO;
  const media = (p.product_images || []).sort((a,b)=>a.position-b.position);
  const big = document.getElementById('gal-big');
  let _shown = media;

  /* #t=0.1 makes the browser seek a hundredth of the way in and paint that
     frame. Without it a video waiting to be played is a black rectangle. */
  const showBig = m => {
    big.innerHTML = isVid(m.path)
      ? `<video id="big-img" src="${esc(IMG(m.path))}#t=0.1" controls playsinline preload="metadata"></video>`
      : `<img id="big-img" src="${esc(IMG(m.path))}" alt="${esc(p.name)}"/>`;
  };

  const cat = (p.product_categories || [])[0]?.categories;
  document.getElementById('p-brand').textContent = p.brand || (cat ? cat.name : '');
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-desc').textContent = p.description || p.subtitle || 'No description provided.';
  /* Material leads the specifications — it is the thing shoppers check first. */
  const dbox = document.getElementById('details-box');
  const spec = [
    p.material ? 'Material: ' + p.material : '',
    colourSpec(p),
    p.details || '',
  ].filter(Boolean).join('\n\n');
  if (spec) document.getElementById('p-details').textContent = spec;
  else dbox.style.display = 'none';

  const soldTxt = window.RG_SOLD(p.sold_count);
  if (soldTxt) document.getElementById('p-sold').innerHTML = '<span>🔥</span>' + esc(soldTxt);

  if (p.rating_avg) {
    const full = Math.round(Number(p.rating_avg));
    document.getElementById('p-stars').innerHTML =
      `<i>${'★'.repeat(full)}${'☆'.repeat(5-full)}</i> ${Number(p.rating_avg).toFixed(1)} (${p.rating_count||0} review${p.rating_count===1?'':'s'})`;
  }

  const flat = parseInt(s.shipping_flat_minor || '0', 10);
  const free = parseInt(s.free_shipping_over_minor || '0', 10);
  document.getElementById('p-delivery').textContent =
    (flat ? `Delivery ${M.fmt(flat, p.currency)}` : 'Delivery calculated at checkout') +
    (free ? `, free on orders over ${M.fmt(free, p.currency)}.` : '.') +
    '\n\n' + (s.payment_instructions || 'Payment is confirmed before dispatch.');

  /* ── colour and size ──
   * A variant is a (colour, size) pair. The colour picks the photographs and
   * narrows the sizes; the size picks the variant that goes in the cart.
   * A colour of null is "Default" — the item that does not come in colours, and
   * the only option for everything that predates this. */
  const vs = (p.product_variants || []).filter(v => v.is_active).sort((a,b)=>a.position-b.position);

  const colours = [];
  for (const v of vs) {
    const c = v.color || '';
    if (!colours.some(x => x === c)) colours.push(c);
  }
  /* Only worth showing when there is a choice to make. An item that is Default
     and nothing else looks exactly as it did before colours existed. */
  const hasColours = colours.filter(c => c !== '').length > 0;
  let _colour = hasColours
    ? (colours.find(c => vs.some(v => (v.color || '') === c && v.stock > 0)) ?? colours[0])
    : '';

  const sizesFor = c => vs.filter(v => (v.color || '') === c);

  function paintColours() {
    const wrap = document.getElementById('col-wrap');
    if (!hasColours) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    document.getElementById('cols').innerHTML = colours.map(c => {
      const left = sizesFor(c).reduce((n, v) => n + (v.stock || 0), 0);
      const label = c === '' ? 'Default' : c;
      return `<button class="swatchbtn ${c === _colour ? 'on' : ''}" data-c="${esc(c)}"
        ${left <= 0 ? 'disabled' : ''} aria-pressed="${c === _colour}" title="${esc(label)}">
        <i style="background:${swatchFor(c)}"></i>${esc(label)}</button>`;
    }).join('');
    document.querySelectorAll('#cols button').forEach(b => b.onclick = () => {
      _colour = b.dataset.c;
      paintColours(); paintSizes(); paintGallery();
    });
  }

  function paintSizes() {
    /* A row called "One Size" alongside real ones is a leftover default and
       reads as something to choose. Where real sizes exist it is not offered;
       where it is all there is, the size row hides itself anyway. */
    const all = sizesFor(_colour);
    const real = all.filter(v => String(v.option_value).trim().toLowerCase() !== 'one size');
    const mine = real.length ? real : all;
    /* "One Size" on its own is not a choice, so it is not offered as one. */
    const meaningful = mine.length > 1
      || (mine[0] && String(mine[0].option_value).toLowerCase() !== 'one size');
    const wrap = document.getElementById('opt-wrap');
    wrap.style.display = meaningful ? '' : 'none';

    if (meaningful) {
      document.getElementById('opt-label').textContent = mine[0]?.option_name || 'Size';
      document.getElementById('opts').innerHTML = mine.map(v =>
        `<button data-v="${v.id}" ${v.stock <= 0 ? 'disabled' : ''} aria-pressed="false">${esc(v.option_value)}</button>`).join('');
      document.querySelectorAll('#opts button').forEach(b => b.onclick = () => {
        document.querySelectorAll('#opts button').forEach(x => x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        pick(mine.find(v => v.id === b.dataset.v));
      });
    }
    const inStock = mine.find(v => v.stock > 0);
    pick(inStock || mine[0] || null);
    if (inStock && meaningful) {
      const b = document.querySelector(`#opts button[data-v="${inStock.id}"]`);
      if (b) b.setAttribute('aria-pressed','true');
    }
  }

  /* Photographs of the chosen colour, plus the item's general photography.
     A colour with no pictures of its own therefore still shows something. */
  function mediaFor(c) {
    const own = media.filter(m => (m.color || '') === c && c !== '');
    const general = media.filter(m => !(m.color || ''));
    return own.length ? own.concat(general) : (general.length ? general : media);
  }

  function paintGallery() {
    const list = hasColours ? mediaFor(_colour) : media;
    _shown = list;
    if (list.length) showBig(list[0]);
    else big.innerHTML = '<div class="skeleton" style="width:100%;height:100%;"></div>';

    document.getElementById('gal-thumbs').innerHTML = list.length > 1
      ? list.map((m,i) => isVid(m.path)
          ? `<span class="gal__vid ${i?'':'on'}" data-i="${i}">
               <video src="${esc(IMG(m.path))}#t=0.1" muted preload="metadata"></video>
               <b>▶</b></span>`
          : `<img src="${esc(IMG(m.path))}" class="${i?'':'on'}" data-i="${i}" alt=""/>`).join('')
      : '';

    document.querySelectorAll('.gal__thumbs [data-i]').forEach(t => t.onclick = () => {
      showBig(_shown[Number(t.dataset.i)]);
      document.querySelectorAll('.gal__thumbs [data-i]').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
    });
  }

  paintColours(); paintSizes(); paintGallery();

  /* ── size guide ── */
  const guide = p.size_guide || (p.product_categories || [])
    .map(pc => pc.categories && pc.categories.size_guide).find(Boolean);
  if (guide) { paintGuide(guide, p.name); paintSizeFacts(_lastSize); }

  loadReviews();

  const { data: more } = await db.from('products')
    .select('id,slug,name,price_minor,compare_at_minor,currency,badge,rating_avg,rating_count,sold_count,product_images(path,position),product_variants(id,stock,price_minor)')
    .eq('status','published').neq('id', p.id).limit(12);
  if (more && more.length) {
    document.getElementById('more-sect').style.display = '';
    document.getElementById('more').innerHTML = more.map(window.RG_CARD).join('');
  }
})();

function pick(v) {
  _v = v; _qty = 1; document.getElementById('qty').textContent = '1';
  _lastSize = v ? v.option_value : null;
  paintSizeFacts(_lastSize);
  const price = v && v.price_minor != null ? v.price_minor : _p.price_minor;
  document.getElementById('p-price').textContent = M.fmt(price, _p.currency);

  const was = document.getElementById('p-was'), offEl = document.getElementById('p-off');
  if (_p.compare_at_minor && _p.compare_at_minor > price) {
    was.textContent = M.fmt(_p.compare_at_minor, _p.currency); was.style.display = '';
    offEl.textContent = '-' + Math.round((1 - price/_p.compare_at_minor)*100) + '%'; offEl.style.display = '';
  } else { was.style.display = 'none'; offEl.style.display = 'none'; }

  const add = document.getElementById('add'), note = document.getElementById('p-stock');
  if (!v || v.stock <= 0) {
    add.disabled = true; add.textContent = v ? 'Out of stock' : 'Unavailable';
    note.textContent = v ? 'This option is out of stock.' : '';
  } else {
    add.disabled = false; add.textContent = 'Add to cart';
    note.textContent = v.stock <= 5 ? `Only ${v.stock} left in stock` : 'In stock';
  }
}

function bump(d) {
  if (!_v) return;
  /* never let the counter promise more than the shelf holds */
  _qty = Math.max(1, Math.min(20, Math.min(_v.stock || 1, _qty + d)));
  document.getElementById('qty').textContent = _qty;
}

document.getElementById('add').onclick = () => {
  if (!_v || _v.stock <= 0) return;
  window.RG_BAG.add(_v.id, _qty);
  window.RG_TOAST(_qty + ' added to cart');
};

function notFound() {
  document.getElementById('state').innerHTML = `<div class="box empty">
    <h2 style="font-size:18px;">Product not found</h2>
    <p>It may have been removed or is not published.</p>
    <a class="btn" href="/shop.html">Continue shopping</a></div>`;
}
</script>
</body>
</html>
