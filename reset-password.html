<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Reset your password — Rex-Giddoty Hubs</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#7526ab"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Rex-Giddoty"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="auth">
  <div class="auth__card">
    <div id="msg"></div>

    <!-- step 1: ask for the link -->
    <div id="ask">
      <h1>Reset your password</h1>
      <p class="lede">We will email you a link to set a new one.</p>
      <form id="ask-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="inp" id="email" type="email" autocomplete="email" required/>
        </div>
        <button class="btn btn--full btn--lg" id="ask-go" type="submit">Send the link</button>
      </form>
      <div class="auth__alt">Remembered it? <a href="/login.html">Sign in</a></div>
    </div>

    <!-- step 2: arrived from the emailed link -->
    <div id="set" style="display:none;">
      <h1>Choose a new password</h1>
      <p class="lede">Make it something you do not use anywhere else.</p>
      <form id="set-form" novalidate>
        <div class="field">
          <label for="pw">New password</label>
          <div class="pw">
            <input class="inp" id="pw" type="password" autocomplete="new-password" required/>
            <button type="button" id="peek" aria-label="Show password"></button>
          </div>
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn btn--full btn--lg" id="set-go" type="submit">Save new password</button>
      </form>
    </div>
  </div>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC;
const msg = document.getElementById('msg');
const show = (kind, html) => { msg.innerHTML = `<div class="msg msg--${kind}">${html}</div>`; };

/* Arriving from the emailed link puts a recovery session in the URL, which the
   client picks up and reports as PASSWORD_RECOVERY. Catching it before the page
   settles is why this listener is registered first. */
let recovering = false;
db.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { recovering = true; toSetStep(); }
});

function toSetStep() {
  document.getElementById('ask').style.display = 'none';
  document.getElementById('set').style.display = '';
}

(async () => {
  await window.RG_CHROME();
  window.RG_PEEK('pw', 'peek');

  /* The link now carries a token hash rather than being a one-time URL that
     spends itself on any GET — mail scanners fetch links before a human sees
     them, and a link consumed by being looked at is always already expired.
     Nothing is spent until this page asks. */
  const token_hash = new URLSearchParams(location.search).get('token_hash');
  if (token_hash) {
    const { error } = await db.auth.verifyOtp({ type: 'recovery', token_hash });
    if (error) {
      show('err', esc(error.message) + '. Reset links last an hour and work once — request another below.');
    } else {
      history.replaceState(null, '', '/reset-password.html');
      recovering = true; toSetStep();
    }
  }

  /* Some browsers deliver the recovery session before the listener attaches, so
     check the URL as well rather than relying on the event alone. */
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('type') === 'recovery' || new URLSearchParams(location.search).get('type') === 'recovery') {
    recovering = true; toSetStep();
  }
  if (hash.get('error_description')) {
    show('err', esc(hash.get('error_description')) +
      '. Reset links expire after a while — request a new one below.');
  }
})();

document.getElementById('ask-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('ask-go');
  const email = document.getElementById('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return show('err', 'That email address does not look right.');

  btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/reset-password.html',
  });
  btn.disabled = false; btn.textContent = 'Send the link';

  if (error) return show('err', esc(error.message));
  /* Deliberately the same answer whether or not the address has an account —
     otherwise this page becomes a way to test which emails are registered. */
  document.getElementById('ask-form').style.display = 'none';
  show('ok', `If <b>${esc(email)}</b> has an account, a reset link is on its way. `
    + 'Check your spam folder if it does not appear.');
});

document.getElementById('set-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('set-go');
  const pw = document.getElementById('pw').value;
  if (pw.length < 8) return show('err', 'Use at least 8 characters.');

  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await db.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Save new password';

  if (error) return show('err', esc(error.message));
  document.getElementById('set-form').style.display = 'none';
  /* Staff who started this from the operations console are sent back there
     rather than into the storefront they were never trying to reach. */
  const backToOps = new URLSearchParams(location.search).get('ops') === '1';
  show('ok', backToOps
    ? 'Your password is updated. <a href="/ops-login.html">Back to operations</a>.'
    : 'Your password is updated. <a href="/account.html">Go to your account</a>.');
});
</script>
</body>
</html>
