<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — Rex-Giddoty Hubs</title>
<meta name="description" content="Sign in to your Rex-Giddoty Hubs account."/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/logo-mark.png"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>

<header class="hdr" data-hdr></header>

<div class="auth">
  <div class="auth__card">
    <h1>Sign in</h1>
    <p class="lede">Welcome back.</p>

    <div id="msg"></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input class="inp" id="email" type="email" autocomplete="email" required/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input class="inp" id="password" type="password" autocomplete="current-password" required/>
          <button type="button" id="peek" aria-label="Show password"></button>
        </div>
        <div class="hint" style="text-align:right;margin-top:6px;">
          <a href="/reset-password.html" style="color:var(--brand);font-weight:600;">Forgot your password?</a>
        </div>
      </div>

      <button class="btn btn--full btn--lg" id="go" type="submit">Sign in</button>
    </form>

    <div class="auth__alt">
      New here? <a href="/register.html">Create an account</a>
    </div>
  </div>
</div>

<footer class="foot" data-foot></footer>
<nav class="tabbar" data-tabbar></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/assets/site.js"></script>
<script>
const db = window.RG_DB, esc = window.RG_ESC;
const msg = document.getElementById('msg');
const show = (kind, html) => { msg.innerHTML = `<div class="msg msg--${kind}">${html}</div>`; };

/* Where to land after signing in — only ever a path on this site, so a crafted
   ?next= cannot bounce someone to another domain. */
const next = (() => {
  const raw = new URLSearchParams(location.search).get('next') || '/account.html';
  return /^\/[A-Za-z0-9_\-./?=&]*$/.test(raw) ? raw : '/account.html';
})();

(async () => {
  await window.RG_CHROME();
  window.RG_PEEK('password', 'peek');
  const { data: { session } } = await db.auth.getSession();
  if (session && session.user && !session.user.is_anonymous) location.replace(next);
  if (new URLSearchParams(location.search).get('confirmed') === '1')
    show('ok', 'Your email is confirmed. Sign in to continue.');
})();

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return show('err', 'Enter your email and password.');

  btn.disabled = true; btn.textContent = 'Signing in…';
  msg.innerHTML = '';
  window.RG_BUSY.show('Signing in', true);
  window.RG_BUSY.pct(15, 'Checking your password');

  const { error } = await db.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';

  if (error) {
    window.RG_BUSY.hide();
    if (/confirm/i.test(error.message)) {
      return show('err', 'This email has not been confirmed yet. Open the link we sent you, or '
        + '<a href="/register.html">create the account again</a>.');
    }
    /* Supabase says "Invalid login credentials" for both a wrong password and an
       unknown email, deliberately — repeating that keeps it that way. */
    return show('err', 'That email and password do not match an account.');
  }
  window.RG_BUSY.pct(70, 'Taking you through');
  await window.RG_BUSY.done();
  window.RG_BUSY.show('Almost there');
  location.replace(next);
});
</script>
</body>
</html>
